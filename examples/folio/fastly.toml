# Fastly Compute: npm run build:fastly writes bin/main.wasm and pkg/folio.tar.gz.
# Locally: viceroy serve -C fastly.toml bin/main.wasm (or fastly compute serve),
# with the KV Store below. To deploy (fastly compute deploy), create a KV Store
# named folio, link it to the service and put the site's files in it
# (node tools/kv.mjs json lists the entries). Generated by
# node tools/kv.mjs fastly > fastly.toml from site/.
manifest_version = 3
name = "folio"
description = "Folio, a CommonMark site generator in Lean, serving a site from a KV Store"
authors = []
language = "other"

[scripts]
build = "npm run build:fastly"

[local_server]
  [local_server.kv_stores]
  [[local_server.kv_stores.folio]]
    key = "content/draft.md"
    data = "---\ntitle: Not yet\ndraft: true\n---\nThis page is a draft: no page, no link, no feed item.\n"
  [[local_server.kv_stores.folio]]
    key = "content/hello.md"
    data = "---\ntitle: Hello, Folio\ndate: 2026-11-01\nsummary: The first page.\n---\nFolio renders **CommonMark**: *emphasis*, `code`, [links](https://commonmark.org),\nlists and more.\n\n- one\n- two\n\n```lean\n#eval Folio.render {} \"*hi*\"\n```\n"
  [[local_server.kv_stores.folio]]
    key = "content/notes/tables.md"
    data = "---\ntitle: Notes in a folder\ndate: 2026-10-30\nslug: notes\n---\nPages can live in folders; the slug comes from the front matter.\n\n> A block quote, with a [reference link][cm].\n\n[cm]: https://spec.commonmark.org/0.31.2/\n"
  [[local_server.kv_stores.folio]]
    key = "content/untrusted.md"
    data = "---\ntitle: <script>alert(\"title\")</script>\ndate: 2026-11-02\n---\nA page written by someone else. Its HTML is shown, not run:\n\n<script>alert(1)</script>\n\n<img src=x onerror=\"alert(2)\"> and [a link](javascript:alert(3)).\n"
  [[local_server.kv_stores.folio]]
    key = "index.md"
    data = "---\ntitle: The Folio example site\nurl: https://example.com/\ndescription: Pages written in Markdown, built by Folio\n---\nThis site is built by `folio build site`. Every page below is a Markdown\nfile in `content/`; drafts are left out.\n"
  [[local_server.kv_stores.folio]]
    key = "layouts/index.html"
    data = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>{{ site.title }}</title>\n<link rel=\"alternate\" type=\"application/rss+xml\" href=\"feed.xml\">\n</head>\n<body>\n<main>\n<h1>{{ site.title }}</h1>\n{{ content }}</main>\n</body>\n</html>\n"
  [[local_server.kv_stores.folio]]
    key = "layouts/page.html"
    data = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>{{ title }} · {{ site.title }}</title>\n<link rel=\"alternate\" type=\"application/rss+xml\" href=\"{{ root }}feed.xml\">\n</head>\n<body>\n<header><a href=\"{{ root }}\">{{ site.title }}</a></header>\n<main>\n<article>\n<h1>{{ title }}</h1>\n<p><time datetime=\"{{ date }}\">{{ date }}</time></p>\n{{ content }}</article>\n</main>\n</body>\n</html>\n"
  [[local_server.kv_stores.folio]]
    key = "files"
    data = "content/draft.md\ncontent/hello.md\ncontent/notes/tables.md\ncontent/untrusted.md\nindex.md\nlayouts/index.html\nlayouts/page.html\n"
