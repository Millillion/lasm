name = "tandem"
version = "0.1.0"
defaultTargets = ["Tandem", "Proofs"]

# The pure core: the document (Fugue's tree, kept as a set of operations),
# its text, local edits, the wire format and the sync server's logic.
# `lake build` checks it with plain Lean 4.35.0: no Lasm, no JavaScript.
[[lean_lib]]
name = "Tandem"

# The theorems about Tandem (PROOFS.md).
[[lean_lib]]
name = "Proofs"

# The server's modules (Lasm.JS and its Web, Deno and Bun bindings): the SQL
# layer, the HTTP and WebSocket glue, embedded files, one SQLite binding per
# target. ServerNode.lean is the program: lasm builds it (npm run build); it
# is not a Lake target.
[[lean_lib]]
name = "Server"

# The editor's browser app (Lasm.UI). Editor.lean starts it: lasm builds it
# (npm run build:client); it is not a Lake target.
[[lean_lib]]
name = "Frontend"
