name = "ledger"
version = "0.1.0"
defaultTargets = ["Ledger", "Proofs"]

# The pure ledger: accounts, transfers, result codes, the rules (generic
# over the store), JSON, the API and the journal auditor. No JavaScript and
# no Lasm import (Ledger.SafeJson is its hardened JSON parser for request
# bodies); check it with `npm run proofs`.
[[lean_lib]]
name = "Ledger"

# The theorems about the ledger (PROOFS.md).
[[lean_lib]]
name = "Proofs"

# The browser page (Lasm.UI): its model, update and view.
[[lean_lib]]
name = "Frontend"

# The server's modules (Lasm.JS and the generated bindings): the SQL
# layer, the HTTP glue (requests, responses, embedded files, each platform's
# server), and one SQLite module per target. ServerNode.lean (and ServerDeno,
# ServerBun, ServerWorkers, ServerFunction) are the programs: lasm builds them
# (npm run build, build:*); they are not Lake targets.
[[lean_lib]]
name = "Server"
