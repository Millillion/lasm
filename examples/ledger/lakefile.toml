name = "ledger"
version = "0.1.0"
defaultTargets = ["Ledger", "Proofs"]

# The pure ledger: accounts, transfers, result codes, the rules (generic
# over the store), JSON, the API and the journal auditor. No JavaScript; its
# one Lasm import is Lasm.RPC.Core (pure Lean: the JSON parser for request
# bodies), so check it with `npm run proofs`.
[[lean_lib]]
name = "Ledger"

# The theorems about the ledger (PROOFS.md).
[[lean_lib]]
name = "Proofs"

# The browser page (Lasm.UI): its model, update and view.
[[lean_lib]]
name = "Frontend"

# The server's modules (Lasm.JS; Lasm.Fetch only for Node's server): the SQL
# layer, the HTTP glue (requests, responses, embedded files, each platform's
# server), and one SQLite binding module per target. ServerNode.lean is the
# program: lasm builds it (npm run build); it is not a Lake target.
[[lean_lib]]
name = "Server"
