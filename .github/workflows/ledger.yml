name: Ledger
# examples/ledger, a double-entry ledger in the style of TigerBeetle, in Lean,
# built as a user builds it (npm ci with the published @lasm/cli pinned in
# its package.json):
# - proofs: every proposition of Proofs/Spec.lean has its theorem, every
#   theorem in Proofs/ compiles and uses only propext, Classical.choice and
#   Quot.sound (no sorry), with Lasm's managed Lean; PROOFS.md, SPEC.md and
#   the stated theorem count agree with what was checked; then the export of
#   the proofs is replayed by Lean's kernel and every external checker Lean
#   4.35.0 ships (`lake check --paranoid`, sandboxed).
# - api-node: the Node server (node:sqlite) on Node 24 and 26: the API test
#   (test/api.mjs), then the bank workload (test/bank.mjs: concurrent
#   transfers and reads, every read sees the same total, the journal replays
#   to every balance), seeded, the seed in the log;
# - tigerbeetle: the differential test (test/tigerbeetle.mjs) against the
#   official TigerBeetle 0.17.9 release binary (SHA-256 pinned) and its
#   official Node client: random workloads, every result code and balance
#   must agree. Five seeds of 1500 batches per run, each printed.
# - dst: the deterministic simulation (test/dst.mjs, on scripts/sim): the
#   server's own code, compiled, under concurrent writers (also racing past
#   the writers' permit, at skewed clocks), lost and duplicated requests,
#   retried batches, crashes, database faults and clock jumps, decided by one
#   seed; 30 fixed seeds, each run twice to check it replays exactly (the
#   nightly runs random seeds for 30 minutes);
# - dst-remote: the same simulation with the server's code built for
#   Cloudflare Workers (wrangler dev, local workerd) and for the browser
#   (headless Chromium, Firefox, WebKit), the world in Node
#   (scripts/sim/remote-host.mjs): 15 fixed seeds each, every result and
#   trace digest equal to Node's;
# - e2e: the browser page's end-to-end tests (test/e2e, Playwright) against
#   the Node build, on Chromium, Firefox and WebKit, no retries.
# Local runtimes only: no account, nothing deployed, CI=1. Free runners only.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/ledger.yml'
      - 'examples/ledger/**'
      - 'scripts/sim/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ledger.yml'
      - 'examples/ledger/**'
      - 'scripts/sim/**'
permissions:
  contents: read
concurrency:
  group: ledger-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/ledger
        run: npm ci --no-audit --no-fund
      - name: npm run proofs (no sorry; only Lean's standard axioms)
        working-directory: examples/ledger
        run: |
          if grep -rnw 'sorry\|native_decide' Ledger Proofs; then echo "::error::sorry or native_decide in the sources"; exit 1; fi
          npm run proofs
      - name: bubblewrap for Lake's sandbox (cached .deb files, else the apt mirror)
        timeout-minutes: 10
        uses: ./.github/actions/apt-cache
        with:
          name: bubblewrap
          run: command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
      - name: lake check --paranoid (Lean's kernel and the external checkers)
        working-directory: examples/ledger
        run: |
          # Lake's sandbox (bwrap) needs unprivileged user namespaces, which
          # Ubuntu 24.04 restricts through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run proofs:paranoid
  api-node:
    name: API and bank workload on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/ledger
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/ledger
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The API test
        working-directory: examples/ledger
        run: node test/api.mjs --name "node-${{ matrix.node }}"
      - name: The bank workload (seeded; the seed is printed first)
        working-directory: examples/ledger
        run: node test/bank.mjs --seconds 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ledger-api-node-${{ matrix.node }}
          path: examples/ledger/test-results/
          retention-days: 14
          if-no-files-found: warn
  dst:
    name: Deterministic simulation (fixed seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/ledger
        run: npm ci --no-audit --no-fund
      - name: npm run build:sim
        working-directory: examples/ledger
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:sim
      - name: The simulation, 30 fixed seeds, each replayed (a failure prints its seed and a repro command)
        working-directory: examples/ledger
        run: node test/dst.mjs --seeds 30 --check-determinism --keep-going
      - name: The simulation, 10 fixed seeds with heavy faults
        if: ${{ !cancelled() }}
        working-directory: examples/ledger
        run: node test/dst.mjs --seeds 10 --first 1001 --faults heavy --keep-going
  dst-remote:
    # The same simulation with the server's code as built for Workers (under
    # wrangler dev: local workerd) and for the browser (headless, the pinned
    # Playwright), the world in Node (scripts/sim/remote-host.mjs); every
    # seed's result and trace digest must equal Node's.
    name: Deterministic simulation on ${{ matrix.title }} (fixed seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: workers, build: 'build:sim-workers', title: 'Cloudflare Workers (wrangler dev)' }
          - { target: chromium, build: 'build:sim-browser', title: 'headless Chromium' }
          - { target: firefox, build: 'build:sim-browser', title: 'headless Firefox' }
          - { target: webkit, build: 'build:sim-browser', title: 'headless WebKit' }
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/ledger
        run: npm ci --no-audit --no-fund
      - name: wrangler 4.152.0 (wrangler dev runs workerd locally)
        if: matrix.target == 'workers'
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund wrangler@4.152.0
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: The pinned Playwright's ${{ matrix.target }}, with its system packages
        if: matrix.target != 'workers'
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.target }}
      - name: npm run build:sim and npm run ${{ matrix.build }}
        working-directory: examples/ledger
        run: |
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:sim
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run ${{ matrix.build }}
      - name: 10 fixed seeds and 5 with heavy faults on ${{ matrix.target }}, each the same as on Node
        working-directory: examples/ledger
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p test-results
          status=0
          node test/dst.mjs --target "$TARGET" --seeds 10 --keep-going | tee test-results/dst-$TARGET.log || status=1
          node test/dst.mjs --target "$TARGET" --seeds 5 --first 1001 --faults heavy --keep-going | tee test-results/dst-$TARGET-heavy.log || status=1
          node test/dst.mjs --seeds 10 --keep-going > test-results/dst-node.log || true
          node test/dst.mjs --seeds 5 --first 1001 --faults heavy --keep-going > test-results/dst-node-heavy.log || true
          node ../../scripts/sim/compare-runs.mjs test-results/dst-$TARGET.log test-results/dst-node.log || status=1
          node ../../scripts/sim/compare-runs.mjs test-results/dst-$TARGET-heavy.log test-results/dst-node-heavy.log || status=1
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ledger-dst-${{ matrix.target }}
          path: examples/ledger/test-results/
          retention-days: 14
          if-no-files-found: ignore
  tigerbeetle:
    name: Differential test against TigerBeetle 0.17.9
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci, and the official TigerBeetle client at the pinned version
        working-directory: examples/ledger
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/tb" --no-audit --no-fund tigerbeetle-node@0.17.9
          echo "TIGERBEETLE_NODE=$RUNNER_TEMP/tb" >> "$GITHUB_ENV"
      - name: io_uring (TigerBeetle needs it)
        run: |
          uname -r
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo "no io_uring_disabled sysctl (io_uring enabled)"
      - name: npm run build
        working-directory: examples/ledger
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: Random workloads, five seeds (each printed; replay with --seed)
        working-directory: examples/ledger
        run: |
          for i in 1 2 3 4 5; do node test/tigerbeetle.mjs --batches 1500; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ledger-tigerbeetle
          path: examples/ledger/test-results/
          retention-days: 14
          if-no-files-found: warn
  e2e:
    name: The browser page on Node, ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/ledger
        run: npm ci --no-audit --no-fund
      - name: npm run build (the browser page, then the Node server embedding it)
        working-directory: examples/ledger
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The pinned Playwright's ${{ matrix.browser }}, with its system packages
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browser }}
      - name: The end-to-end tests
        working-directory: examples/ledger
        env:
          BROWSERS: ${{ matrix.browser }}
          E2E_NAME: node-${{ matrix.browser }}
        run: npm run test:e2e -- --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ledger-e2e-node-${{ matrix.browser }}
          path: examples/ledger/test-results/
          retention-days: 14
          if-no-files-found: warn
