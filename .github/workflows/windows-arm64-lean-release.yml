name: Native Windows ARM64 Lean 4.34.1 distribution
on:
  workflow_dispatch:
    inputs:
      leantar-tag:
        description: Exact validated native leantar draft tag
        type: string
        required: true
      leantar-sha256:
        description: SHA-256 of that leantar archive
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: windows-arm64-lean-release
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 330
    env:
      LASM_TOOLCHAIN_CACHE: ${{ github.workspace }}/.cache/managed-tools
      MSYSTEM: CLANGARM64
      CHERE_INVOKING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          architecture: arm64
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check the native host and resource accounting below the cap
        run: |
          node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'win32-arm64')"
          node scripts/full-lean/run-bounded.mjs --memory-mib 512 --report .work/windows-release-guard-control.json -- node test/fixtures/windows-guard.mjs
      - name: Prepare authenticated same-version seed and native leantar
        env:
          GH_TOKEN: ${{ github.token }}
          LASM_LEANTAR_TAG: ${{ inputs.leantar-tag }}
          LASM_LEANTAR_SHA256: ${{ inputs.leantar-sha256 }}
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 --timeout-seconds 1800 --report .work/windows-lean-prepare-resources.json -- node scripts/ci/windows-lean-release-prepare.mjs
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          msystem: CLANGARM64
          cache: false
          path-type: minimal
          install: >-
            make git tar diffutils binutils
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm-tools
            mingw-w64-clang-aarch64-gmp
            mingw-w64-clang-aarch64-libuv
            mingw-w64-clang-aarch64-openssl
      - name: Build and relocate native Lean with one worker
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bash = Join-Path $env:MSYS2_LOCATION 'usr/bin/bash.exe'
          $env:LASM_BOOTSTRAP_NODE = (Get-Command node).Source
          node scripts/full-lean/run-bounded.mjs --timeout-seconds 16200 --report .work/windows-arm64-lean-release-resources.json -- $bash --login scripts/full-lean/bootstrap-windows-arm64-lean-release.sh
      - name: Retain the verified native distribution in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --max-old-space-size=128 scripts/ci/windows-bootstrap-retain.mjs lean
      - name: Preserve native bootstrap evidence
        if: always()
        run: |
          node -e "const f=require('node:fs');for(const p of ['.work/windows-release-guard-control.json','.work/windows-lean-prepare-resources.json','.work/windows-arm64-lean-release/inputs.json','.work/windows-arm64-lean-release/distribution/result.json','.work/windows-arm64-lean-release-resources.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
