name: Porter
# examples/porter, an OpenID Connect provider in Lean, built as a user builds
# it (npm ci with the published @lasm/cli pinned in its package.json):
# - proofs: every proposition of Proofs/Spec.lean has its theorem, every
#   theorem in Proofs/ compiles and uses only propext, Classical.choice and
#   Quot.sound (no sorry, no native_decide), and no definition the request
#   handlers reach is partial, unsafe, opaque or a panic, with Lasm's managed
#   Lean; PROOFS.md, SPEC.md and the stated theorem count agree with what was
#   checked; then the export of the proofs is replayed by Lean's kernel and
#   every external checker Lean 4.35.0 ships (`lake check --paranoid`).
# - node: the Node server (node:sqlite, Web Crypto) on Node 24 and 26: the
#   oracle tests (openid-client 6.8.8, oauth4webapi 3.8.8 and jose 6.2.12
#   validate everything Porter issues, every signature included), then the
#   adversarial suite (RFC 6749/6819/9700, OpenID Connect Core);
# - fuzz: the endpoint fuzzer for three minutes against the Node build
#   (seeded; the seed is printed first; failing requests uploaded);
# - dst: the deterministic simulation (test/dst.mjs, on scripts/sim): the
#   server's own code, compiled, signing agents in, refreshing and attacking
#   (codes redeemed twice, rotated refresh tokens reused) under lost and
#   duplicated requests, racing requests at skewed clocks, the clock jumping
#   past every lifetime, crashes and database faults, decided by one seed;
#   30 fixed seeds, each run twice to check it replays exactly (the nightly
#   runs random seeds for 30 minutes);
# - e2e: the sign-in and consent pages (the Lasm.UI app) in Chromium,
#   Firefox and WebKit (Playwright, no retries): sign in, consent, deny, a
#   wrong password, the pages without JavaScript, no script error or CSP
#   violation; the code the browser brings back is redeemed with oauth4webapi.
# Local runtimes only: no account, nothing deployed, CI=1. Free runners only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/porter.yml'
      - 'examples/porter/**'
      - 'scripts/sim/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/porter.yml'
      - 'examples/porter/**'
      - 'scripts/sim/**'
permissions:
  contents: read
concurrency:
  group: porter-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/porter
        run: npm ci --no-audit --no-fund
      - name: npm run proofs (no sorry; only Lean's standard axioms; total handlers)
        working-directory: examples/porter
        run: |
          if grep -rnw 'sorry\|native_decide' Porter Proofs; then echo "::error::sorry or native_decide in the sources"; exit 1; fi
          npm run proofs
      - name: lake check --paranoid (Lean's kernel and the external checkers)
        working-directory: examples/porter
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
          npm run proofs:paranoid
  node:
    name: Oracles and attacks on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/porter
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/porter
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The oracle tests (openid-client, oauth4webapi, jose)
        working-directory: examples/porter
        run: node test/oracles.mjs --name "node-${{ matrix.node }}"
      - name: The adversarial suite
        working-directory: examples/porter
        run: node test/attacks.mjs --name "node-${{ matrix.node }}"
  dst:
    name: Deterministic simulation (fixed seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/porter
        run: npm ci --no-audit --no-fund
      - name: npm run build:sim
        working-directory: examples/porter
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:sim
      - name: The simulation, 30 fixed seeds, each replayed (a failure prints its seed and a repro command)
        working-directory: examples/porter
        run: node test/dst.mjs --seeds 30 --check-determinism --keep-going
      - name: The simulation, 10 fixed seeds with heavy faults
        if: ${{ !cancelled() }}
        working-directory: examples/porter
        run: node test/dst.mjs --seeds 10 --first 1001 --faults heavy --keep-going
  fuzz:
    name: The endpoint fuzzer (3 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/porter
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/porter
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The fuzzer (seeded; the seed is printed first)
        working-directory: examples/porter
        run: node test/fuzz.mjs --seconds 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: porter-fuzz
          path: examples/porter/test-results/
          retention-days: 14
          if-no-files-found: ignore
  e2e:
    name: The sign-in pages on Node, ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/porter
        run: npm ci --no-audit --no-fund
      - name: npm run build (the browser app, then the Node server embedding it)
        working-directory: examples/porter
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The pinned Playwright's ${{ matrix.browser }}, with its system packages
        timeout-minutes: 30
        run: |
          npm install --prefix .work/pw --no-audit --no-fund playwright-core@1.63.0
          bash scripts/ci/playwright-install.sh "${{ matrix.browser }}"
      - name: The end-to-end tests
        working-directory: examples/porter
        env:
          BROWSERS: ${{ matrix.browser }}
          E2E_NAME: node-${{ matrix.browser }}
        run: npm run test:e2e -- --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: porter-e2e-${{ matrix.browser }}
          path: examples/porter/test-results/
          retention-days: 14
          if-no-files-found: warn
