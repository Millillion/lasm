name: Dependable tooling
# Claim 4 of docs/proposals/TESTING_STRATEGY.md, black box (docs/TESTING.md#dependable-tooling):
#   - error corpus (scripts/tooling/error-corpus.mjs): every error a user can
#     trigger prints a clear message, never a stack trace. Against a candidate
#     packed from this commit and against the published @lasm/cli@latest;
#     pull requests, pushes to main and nightly.
#   - metamorphic build tests (scripts/tooling/metamorphic.mjs): incremental
#     builds equal clean ones, the same input gives the same bytes (two
#     directories, a cold tool cache), renaming an unrelated file or definition
#     changes nothing else, touching sources rebuilds nothing; lasm build and
#     a lasm dev session (edit, touch, rename, revert, a save by rename); node,
#     wasi, workers and browser, release and dev profiles.
#   - fault injection (scripts/tooling/faults.mjs), one job per target: killed
#     builds and installs, cut and stalled downloads, full disks, read-only and
#     corrupted caches; with node also npm installs (killed, cut, full disk) and
#     killed lasm dev sessions; each must end in success on retry or a clear error.
# Metamorphic and fault runs are slow: nightly, by hand, and on pull requests
# that change scripts/tooling/ or this workflow.
# Each run installs the CLI with npm, as a user does, into a fresh directory.
on:
  pull_request:
    branches: [main]
    # Not on a change to docs, Markdown, content/ or the five flagship apps only
    # (they have their own workflows); the push to main always runs (docs/CI.md).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'content/**'
      - 'examples/conduit/**'
      - 'examples/folio/**'
      - 'examples/ledger/**'
      - 'examples/porter/**'
      - 'examples/tandem/**'
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooling-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.scope.outputs.slow }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "slow=${{ github.event_name != 'push' }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -qE '^(scripts/tooling/|\.github/workflows/tooling\.yml$)'; then echo slow=true; else echo slow=false; fi >> "$GITHUB_OUTPUT"
  pack:
    if: github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The retained runtime input is a draft release asset (needs contents: write to read).
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/process-guard
      - name: Download the pinned retained runtime input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/fetch-node-runtime.mjs
      - name: Verify and extract the runtime
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 -- node scripts/ci/restore-node-runtime.mjs
      - name: Pack
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 -- /usr/bin/env GITHUB_RUN_ID="$GITHUB_RUN_ID" node scripts/package-node-release.mjs .work/node-candidate .work/node-runtime-restored/runtime .work/node-runtime-restored/native "$(node -p "require('./.work/node-runtime-restored/provenance.json').runtimeManifestSha256")" "$LASM_CANDIDATE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-packed-candidate
          path: .work/node-candidate/lasm-compiler-${{ env.LASM_CANDIDATE_VERSION }}.tgz
          retention-days: 3
          if-no-files-found: error

  error-corpus:
    name: Error corpus (${{ matrix.cli }})
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cli: [candidate, published]
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # An old Node for the "wrong Node version" case, then the supported one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: echo "OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/process-guard
      - if: matrix.cli == 'candidate'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tooling-packed-candidate
          path: .work/node-candidate
      - name: Install the CLI as a user would
        run: |
          mkdir -p "$RUNNER_TEMP/lasm" && cd "$RUNNER_TEMP/lasm"
          echo '{"private":true}' > package.json
          if [ "${{ matrix.cli }}" = candidate ]; then
            npm install "$GITHUB_WORKSPACE/.work/node-candidate/lasm-compiler-$LASM_CANDIDATE_VERSION.tgz" --no-audit --no-fund
            echo "LASM_BIN=$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" >> "$GITHUB_ENV"
          else
            npm install @lasm/cli@latest --no-audit --no-fund
            echo "LASM_BIN=$RUNNER_TEMP/lasm/node_modules/@lasm/cli/bin/lasm.mjs" >> "$GITHUB_ENV"
          fi
      - name: Error corpus
        run: |
          node "$LASM_BIN" --version
          node scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- /usr/bin/env CI=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            node scripts/tooling/error-corpus.mjs --lasm "$LASM_BIN" --only network --old-node "$OLD_NODE" --work "$RUNNER_TEMP/corpus" --report "$RUNNER_TEMP/error-corpus.json" \
            ${{ matrix.cli == 'candidate' && '--inventory check' || '' }}
      - if: always()
        run: cat "$RUNNER_TEMP/error-corpus.json" 2>/dev/null || true

  metamorphic:
    name: Metamorphic (${{ matrix.target }})
    needs: [scope, pack]
    if: needs.scope.outputs.slow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [node, wasi, workers, browser]
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/process-guard
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: tooling-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      # Dev builds whose bytes differ from a clean build are compared by running
      # both; the browser's run in headless Chromium.
      - name: Pinned Playwright and Chromium (browser target)
        if: matrix.target == 'browser'
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browsers: chromium
          cache-key: playwright-1.63.0-tooling-chromium-ubuntu-24.04
      - name: Metamorphic build tests
        run: |
          # Not under run-bounded: it keeps 8 GiB of host headroom, which on a
          # 16 GiB runner stops a browser or edge build (about 5 GiB) part way.
          LASM_TOOLCHAIN_CACHE="$RUNNER_TEMP/tool-cache" node scripts/tooling/metamorphic.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" --targets ${{ matrix.target }} \
            ${{ matrix.target == 'browser' && '--playwright "$GITHUB_WORKSPACE/.work/pw"' || '' }} --work "$RUNNER_TEMP/mm" --report "$RUNNER_TEMP/metamorphic.json"
      - if: always()
        run: cat "$RUNNER_TEMP/metamorphic.json" 2>/dev/null || true

  faults:
    name: Fault injection (${{ matrix.target }})
    needs: [scope, pack]
    if: needs.scope.outputs.slow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # node also runs the npm install and lasm dev scenarios.
        target: [node, wasi, workers, browser]
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: tooling-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      # Not under run-bounded: the full-disk scenarios mount small loop file
      # systems with sudo, which a transient systemd scope would not see.
      - name: Fault injection
        run: |
          node scripts/tooling/faults.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" --target ${{ matrix.target }} \
            --package "$GITHUB_WORKSPACE/.work/node-candidate/lasm-compiler-$LASM_CANDIDATE_VERSION.tgz" --work "$RUNNER_TEMP/faults" --report "$RUNNER_TEMP/faults.json"
      - if: always()
        run: cat "$RUNNER_TEMP/faults.json" 2>/dev/null || true
