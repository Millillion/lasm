name: Application build file controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-file-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  files:
    if: github.event.repository.visibility == 'public'
    name: Files ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { platform: darwin-x64, runner: macos-15-intel, arch: x64 }
          - { platform: darwin-arm64, runner: macos-15, arch: arm64 }
          - { platform: win32-x64, runner: windows-2022, arch: x64 }
          - { platform: win32-arm64, runner: windows-11-arm, arch: arm64 }
    env:
      LASM_EXPECT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify native host
        run: node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,process.env.LASM_EXPECT_PLATFORM)"
      - name: Native file ABI, OS lock, and deployment preservation controls
        run: node --max-old-space-size=128 --test --test-isolation=none test/native-file-abi.test.mjs test/application-lock.test.mjs test/application-files.test.mjs
      - name: CLI and compatibility launcher controls without tool downloads
        run: node --max-old-space-size=128 --test --test-isolation=none test/cli-arguments.test.mjs test/application-launcher.test.mjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        id: deno
        if: success() || failure()
        with:
          deno-version: 2.9.7
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: bun
        if: success() || failure()
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Stock Deno native file ABI
        if: ${{ !cancelled() && steps.deno.outcome == 'success' }}
        run: deno run -A integration/native-file-abi.mjs deno 2.9.7
      - name: Stock Bun native file ABI
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        run: bun integration/native-file-abi.mjs bun 1.4.2
      # Lightweight filesystem checks only; child fixtures each use a 64 MiB
      # JS heap cap. No compiler builds, artifacts or Actions caches.
