name: Mutation testing
# Stryker on the critical JavaScript (docs/TESTING.md#mutation-testing): each
# module of scripts/mutation/modules.json is mutated and its own node:test files
# run against every mutant. A module whose score falls below its recorded
# baseline (docs/evidence/mutation-baseline.json, less 0.5 points) fails.
# Nightly and on demand: every module, one job each. Pull requests: only the
# modules whose sources or tests changed (none: the job does nothing).
# Free runners; the tests need no managed Lean or native helpers.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to run (space-separated; empty: all)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/node-js.mjs'
      - 'src/lasm-modules/ui-dom.mjs'
      - 'src/dev-build-service.mjs'
      - 'src/application-build-client.mjs'
      - 'src/application-files.mjs'
      - 'src/cache-lifecycle.mjs'
      - 'src/link-driver/**'
      - 'src/*link*.mjs'
      - 'src/edge/**'
      - 'src/wasi/wasi-link.mjs'
      - 'src/notices.mjs'
      - 'test/**'
      - 'scripts/mutation/**'
      - 'docs/evidence/mutation-baseline.json'
      - '.github/workflows/mutation.yml'
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: list
        env:
          REQUESTED: ${{ inputs.modules }}
        run: |
          node -e '
            const all = require("./scripts/mutation/modules.json").modules.map(m => m.name);
            const asked = (process.env.REQUESTED || "").split(/\s+/).filter(Boolean);
            for (const name of asked) if (!all.includes(name)) { console.error(`Unknown module ${name}`); process.exit(1); }
            console.log(`names=${JSON.stringify(asked.length ? asked : all)}`);
          ' >> "$GITHUB_OUTPUT"
  module:
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.modules.outputs.names) }}
    env:
      CI: '1'
      BROWSER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stryker (${{ matrix.name }})
        run: node scripts/mutation/run.mjs ${{ matrix.name }} --concurrency 3 --check docs/evidence/mutation-baseline.json
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.name }}
          path: .work/mutation
          retention-days: 14
          if-no-files-found: ignore
  changed:
    if: github.event.repository.visibility == 'public' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: '1'
      BROWSER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stryker on the changed modules
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/mutation/run.mjs --changed-since "$BASE" --concurrency 3 --check docs/evidence/mutation-baseline.json
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-changed
          path: .work/mutation
          retention-days: 14
          if-no-files-found: ignore
