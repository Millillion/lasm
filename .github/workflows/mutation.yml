name: Mutation testing
# Stryker on the JavaScript under src/ (docs/TESTING.md#mutation-testing): each
# module of scripts/mutation/modules.json is mutated and its own node:test files
# run against every mutant. A module whose score falls below its threshold
# (docs/evidence/mutation-baseline.json) fails.
# Nightly and on demand: every module, one job each. Pull requests: only the
# modules whose sources or tests changed, one job each (none: no job runs).
# Free runners; the tests need no managed Lean or native helpers.
on:
  schedule:
    - cron: '37 5 * * 1-6'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to run (space-separated; empty: all)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/mutation/**'
      - 'docs/evidence/mutation-baseline.json'
      - 'package-lock.json'
      - '.github/workflows/mutation.yml'
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sunday:
    # Nothing runs on a scheduled Sunday in New York (sunday-guard.yml).
    uses: ./.github/workflows/sunday-guard.yml

  modules:
    needs: sunday
    if: needs.sunday.outputs.skip != 'true' && (github.event.repository.visibility == 'public')
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: list
        env:
          REQUESTED: ${{ inputs.modules }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ]; then
            echo "names=$(node scripts/mutation/run.mjs --changed-since "$BASE" --list)" >> "$GITHUB_OUTPUT"
          else
            # shellcheck disable=SC2086
            echo "names=$(node scripts/mutation/run.mjs $REQUESTED --list)" >> "$GITHUB_OUTPUT"
          fi
  module:
    needs: [sunday, modules]
    if: needs.sunday.outputs.skip != 'true' && (needs.modules.outputs.names != '[]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.modules.outputs.names) }}
    env:
      CI: '1'
      BROWSER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stryker (${{ matrix.name }})
        run: node scripts/mutation/run.mjs ${{ matrix.name }} --concurrency 3 --check docs/evidence/mutation-baseline.json
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.name }}
          path: .work/mutation
          retention-days: 14
          if-no-files-found: ignore
