name: Retain a verified Linux Node candidate
on:
  workflow_dispatch:
    inputs:
      candidate-cache-key:
        description: Exact cache key of the already tested candidate
        required: true
        type: string
      candidate-sha256:
        description: SHA-256 of the unchanged npm archive
        required: true
        type: string
      candidate-source-revision:
        description: Original source commit recorded inside the package
        required: true
        type: string
      acceptance-run-id:
        description: Completed workflow run with both native jobs successful
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lasm-node-candidate-retention
  cancel-in-progress: false
jobs:
  retain:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      LASM_CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
      LASM_CANDIDATE_SOURCE_REVISION: ${{ inputs.candidate-source-revision }}
      LASM_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Verify both prior native jobs and their exact candidate reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --max-old-space-size=128 scripts/ci/node-candidate-acceptance.mjs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/node-candidate/lasm-compiler-0.1.0-experimental.34.tgz
          key: ${{ inputs.candidate-cache-key }}
          fail-on-cache-miss: true
      - name: Verify original archive identity and prepare its receipt
        run: node --max-old-space-size=128 scripts/ci/node-candidate-receipt.mjs
      # The draft targets the retention commit. Notes preserve the actual package
      # and test sources; no new tag at an unreferenced historical workflow commit
      # or additional workflow-token scope is needed.
      - name: Retain the exact tested candidate in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "node-linux-candidate-$GITHUB_RUN_ID" \
            .work/node-candidate/lasm-compiler-0.1.0-experimental.34.tgz \
            .work/node-candidate/SHA256SUMS.txt \
            .work/node-candidate/acceptance.json \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title 'Lasm Linux Node candidate 0.1.0-experimental.34' \
            --notes-file .work/node-candidate/notes.md
