name: Native installed Windows Node consumer
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      architecture:
        required: true
        type: string
      cache-key:
        required: true
        type: string
      sha256:
        required: true
        type: string
      candidate-version:
        type: string
        default: 0.1.0-experimental.46
permissions:
  contents: read
jobs:
  installed:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      LASM_CANDIDATE_SHA256: ${{ inputs.sha256 }}
      LASM_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      LASM_TOOLCHAIN_CACHE: ${{ github.workspace }}/.cache/managed-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify native host, deadline cleanup and isolated Node/npm controls
        run: |
          node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'win32-'+process.env.EXPECTED_ARCHITECTURE)"
          node integration/windows-guard-deadline.mjs
          node scripts/full-lean/run-bounded.mjs --memory-mib 512 --timeout-seconds 180 --report .work/windows-discovery-resources.json -- node -e "require('node:child_process').execFileSync(process.env.LASM_RESOURCE_PYTHON,['-I','-B','test/windows-file-walk.test.py'],{stdio:'inherit'})"
          node scripts/full-lean/run-bounded.mjs --memory-mib 1024 --timeout-seconds 1200 --report .work/windows-isolation-resources.json -- node scripts/ci/windows-isolation-controls.mjs
      - name: Focused host and bundle controls
        # The legacy platform suite needs an externally installed Lean compiler.
        # Managed compiler/linker behavior is exercised by the consumer below.
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 512 --report .work/windows-focused-resources.json -- node --test --test-concurrency=1 test/native-application-bundle.test.mjs test/native-program.test.mjs test/node-host.test.mjs test/application-support.test.mjs test/application-paths.test.mjs test/windows-tool-paths.test.mjs test/cli-arguments.test.mjs
      - name: Preserve standard and file IO bytes with native Windows CRT adapters
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 512 --timeout-seconds 180 --report .work/windows-stdio-resources.json -- node --test --test-concurrency=1 test/stdio-bytes.test.mjs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/node-candidate/lasm-compiler-${{ inputs.candidate-version }}.tgz
          key: ${{ inputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Prepare native ARM64 compiler for independent reference outputs
        if: inputs.architecture == 'arm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: oracle
        with:
          msystem: CLANGARM64
          cache: false
          path-type: minimal
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-gmp
            mingw-w64-clang-aarch64-libuv
      - name: Keep the reference compiler outside the product environment
        if: inputs.architecture == 'arm64'
        env:
          ORACLE_ROOT: ${{ steps.oracle.outputs.msys2-location }}
        run: |
          "MSYS2_LOCATION=$env:ORACLE_ROOT" >> $env:GITHUB_ENV
          "LASM_NATIVE_ORACLE_CC=$(Join-Path $env:ORACLE_ROOT 'clangarm64/bin/clang.exe')" >> $env:GITHUB_ENV
      - name: Cold install, installed CLI, offline cache and copied deployments
        run: node scripts/ci/run-node-windows.mjs
      - name: Preserve native results
        if: always()
        run: |
          node -e "const f=require('node:fs');for(const p of ['.work/windows-isolation-controls/result.json','.work/windows-isolation-controls/online.json','.work/windows-isolation-controls/offline.json','.work/windows-isolation-resources.json','.work/windows-focused-resources.json','.work/windows-stdio-resources.json','.work/node-windows-acceptance/result.json','.work/node-windows-resources.json','.work/node-windows-disk.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
