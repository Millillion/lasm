name: Link toolchain distribution
# Maintainer-only (docs/TOOLCHAIN_SLIMMING.md, Phase 2 milestone D): build the
# prebuilt sysroot on two hosts, repackage each pinned emsdk archive into a
# per-platform native tools archive plus the shared Emscripten JavaScript and
# sysroot archive, prove determinism and cross-platform equality of the shared
# archive, smoke-test each native archive on its own runner, then optionally
# retain the archives as public release assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the archives (only used when publishing)
        type: string
        default: emscripten-6.0.9-lasm-toolchain-v1
      publish:
        description: Create the public release after every check passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: link-toolchain
  cancel-in-progress: false
jobs:
  sysroot:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x64, runner: ubuntu-24.04 }
          - { host: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build the prebuilt sysroot from this host's repaired SDK
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib 4096 --report .work/sysroot-resources.json -- \
            /usr/bin/env LASM_TOOLCHAIN_CACHE="$PWD/.cache/link-toolchain-sdk" \
            node scripts/link-driver/build-sysroot.mjs --output .work/link-toolchain/sysroot
          node -e "const m=require('./.work/link-toolchain/sysroot/sysroot.json'); console.log(m.archive.name, m.archive.bytes, m.archive.sha256)"
          { echo "### Sysroot built on ${{ matrix.host }}"; echo '```'; node -e "const m=require('./.work/link-toolchain/sysroot/sysroot.json'); console.log(m.archive.name, m.archive.bytes, m.archive.sha256, 'sdk', m.sdkIdentity)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sysroot-${{ matrix.host }}
          path: |
            .work/link-toolchain/sysroot/*.tar.zst
            .work/link-toolchain/sysroot/sysroot.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  repackage:
    needs: sysroot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: sysroot-linux-x64
          path: .work/link-toolchain/sysroot
      - name: Download the pinned emsdk archive
        run: |
          url=$(node -p "require('./src/sdk-tools.json').artifacts[process.env.PLATFORM].url")
          mkdir -p .work/link-toolchain/dl
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --output .work/link-toolchain/dl/upstream "$url"
          df -h .
      - name: Repackage twice and record digests
        # The shared archive is written once, from linux-x64; every other platform
        # packs it from its own emsdk archive into a digest sink for comparison.
        run: |
          shared=hash; [ "$PLATFORM" = linux-x64 ] && shared=write
          node scripts/full-lean/run-bounded.mjs --memory-mib 8192 --report .work/link-toolchain-$PLATFORM-resources.json -- \
            node scripts/link-driver/build-toolchain.mjs --platform "$PLATFORM" --archive .work/link-toolchain/dl/upstream \
              --sysroot .work/link-toolchain/sysroot/emscripten-6.0.9-cache-wasm64-pic.tar.zst --shared $shared \
              --out .work/link-toolchain/out --work .work/link-toolchain/work --twice
          rm -f .work/link-toolchain/dl/upstream
          ls -l .work/link-toolchain/out
          { echo "### $PLATFORM"; echo '```'; node -e "const r=require('./.work/link-toolchain/out/report-' + process.env.PLATFORM + '.json'); for (const a of r.archives) console.log(a.name, a.bytes, a.sha256, a.written ? 'written' : 'digest'); console.log('emscripten subset', r.emscriptenSubset.digest); console.log('libraries', r.libraries.join(' ') || 'none'); console.log('external', Object.keys(r.externalImports).join(' '))"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tools-${{ matrix.platform }}
          path: .work/link-toolchain/out/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  shared:
    needs: [sysroot, repackage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tools-*
          path: .work/link-toolchain/all
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sysroot-*
          path: .work/link-toolchain/sysroots
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Require equivalent sysroots, identical shared archives and the size ceiling
        # Sysroots from two hosts must be byte-identical except for the libc member
        # names emcc assigns in directory-listing order (compare-sysroots.mjs).
        run: |
          ls -lR .work/link-toolchain/sysroots
          node scripts/link-driver/compare-sysroots.mjs .work/link-toolchain/sysroots/sysroot-linux-x64/emscripten-6.0.9-cache-wasm64-pic.tar.zst \
            .work/link-toolchain/sysroots/sysroot-linux-arm64/emscripten-6.0.9-cache-wasm64-pic.tar.zst --json .work/link-toolchain/sysroot-comparison.json
          { echo '### Sysroot linux-x64 vs linux-arm64'; echo '```json'; cat .work/link-toolchain/sysroot-comparison.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node scripts/link-driver/toolchain-catalog.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.tag }}/" .work/link-toolchain/all/report-*.json > .work/link-toolchain/link-toolchain.json
          node -e "
            const fs = require('fs'), entry = JSON.parse(fs.readFileSync('.work/link-toolchain/link-toolchain.json'));
            for (const a of [...Object.values(entry.native), entry.shared])
              if (fs.statSync('.work/link-toolchain/all/' + a.name + '.tar.zst').size !== a.bytes) throw new Error(a.name + ' size mismatch');"
          { echo '### Catalog entry'; echo '```json'; cat .work/link-toolchain/link-toolchain.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  native:
    needs: repackage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: win32-x64, runner: windows-2025 }
    env:
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: tools-linux-x64
          path: .work/link-toolchain/check
      - uses: actions/download-artifact@v8
        if: matrix.platform != 'linux-x64'
        with:
          name: tools-${{ matrix.platform }}
          path: .work/link-toolchain/check
      - name: Run every tool natively and compile, link and optimize a pthread C file
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib 2048 --report .work/link-toolchain-smoke-resources.json -- \
            node scripts/link-driver/smoke-toolchain.mjs --native ".work/link-toolchain/check/emscripten-6.0.9-$PLATFORM-tools.tar.zst" \
              --shared .work/link-toolchain/check/emscripten-6.0.9-lasm-shared.tar.zst --work .work/link-toolchain/smoke \
              --report ".work/link-toolchain/smoke-$PLATFORM.json"
          { echo "### $PLATFORM"; echo '```json'; cat ".work/link-toolchain/smoke-$PLATFORM.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.platform }}
          path: .work/link-toolchain/smoke-${{ matrix.platform }}.json
          retention-days: 3

  smoke-equality:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: smoke-*
          path: .work/smoke
          merge-multiple: true
      - name: Compare native smoke outputs with linux-x64 (reported)
        run: |
          node -e "
            const fs = require('fs'), dir = '.work/smoke', reference = JSON.parse(fs.readFileSync(dir + '/smoke-linux-x64.json'));
            const lines = [];
            for (const name of fs.readdirSync(dir).sort()) {
              const report = JSON.parse(fs.readFileSync(dir + '/' + name));
              const differ = Object.keys(reference.outputs).filter(file => report.outputs[file] !== reference.outputs[file]);
              lines.push(report.platform + ': ' + (differ.length ? 'differs in ' + differ.join(', ') : 'identical outputs'));
            }
            console.log(lines.join('\n'));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Smoke outputs vs linux-x64\n\n' + lines.map(line => '- ' + line).join('\n') + '\n');"

  publish:
    needs: [shared, native]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tools-*
          path: .work/link-toolchain/all
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sysroot-linux-x64
          path: .work/link-toolchain/sysroot
      - name: Retain the verified archives as public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp .work/link-toolchain/sysroot/sysroot.json .work/link-toolchain/all/sysroot.json
          cd .work/link-toolchain/all
          node ../../../scripts/link-driver/toolchain-catalog.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" report-*.json > link-toolchain.json
          sha256sum *.tar.zst > SHA256SUMS
          cat > notes.md <<EOF
          Lasm's Node link-driver toolchain for Emscripten 6.0.9, produced by run ${GITHUB_RUN_ID} from ${GITHUB_SHA}.
          Each emscripten-6.0.9-<platform>-tools archive is an unmodified subset of the pinned upstream emsdk archive;
          emscripten-6.0.9-lasm-shared holds the repaired Emscripten JavaScript subset and the prebuilt wasm64 sysroot.
          See the NOTICE inside each archive. report-*.json record upstream digests, archive digests and determinism checks.
          EOF
          printf '\nSource revision: %s\n' "$GITHUB_SHA" >> notes.md
          RELEASE_TARGET="$GITHUB_SHA"; [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA" ] || RELEASE_TARGET="$GITHUB_REF_NAME"  # GitHub refuses non-tip SHAs as release targets
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title "$TAG" --notes-file notes.md \
            *.tar.zst report-*.json link-toolchain.json sysroot.json SHA256SUMS
