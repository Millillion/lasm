name: Unchanged upstream native build-time checks
on:
  workflow_dispatch:
    inputs:
      selection:
        type: choice
        options: [all, remaining-2026-09-23]
        default: all
        description: Entire category or every uncompleted case in the preserved first campaign
permissions:
  contents: read
concurrency:
  group: upstream-native-build-time-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    name: Native shard ${{ matrix.shard }}
    env:
      LASM_NATIVE_SELECTION: ${{ inputs.selection }}
      LASM_NATIVE_SHARD: ${{ matrix.shard }}
      LASM_NATIVE_SHARDS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check the release and fetch the pinned unchanged sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/leanprover/lean4/releases/latest --jq .tag_name)" = v4.34.0
          mkdir -p .cache/downloads
          # The recorded archive uses the full-commit directory prefix, not the
          # tag-based prefix. Preserve its original checksum and source manifest.
          curl --fail --location --retry 3 --output .cache/downloads/lean4-v4.34.0.tar.gz https://github.com/leanprover/lean4/archive/293d5d0c0c3f3dded4688b3ccd6a33939ac5102b.tar.gz
          printf '%s  %s\n' 09ae33c3327dd90fe934a79f5c9399b720dc340afee5a5c9b08cfe4a6a32226b .cache/downloads/lean4-v4.34.0.tar.gz | sha256sum -c -
      - name: Enable the per-user resource boundary on this disposable runner
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Prepare the exact shard within the resource boundary
        run: node scripts/full-lean/run-bounded.mjs --report .work/upstream-native-ci-prepare-resources.json -- /bin/bash scripts/application-tests/native-ci.sh prepare
      - name: Execute one bounded native campaign
        run: node scripts/full-lean/run-bounded.mjs --report .work/upstream-native-ci-resources.json -- /bin/bash scripts/application-tests/native-ci.sh run
      - name: Preserve evidence in logs and a compact summary
        if: always()
        run: |
          node scripts/application-tests/report-ci.mjs .work/upstream-native-ci .work/upstream-native-ci-resources.json
          node -e "const f=require('node:fs');for(const p of ['.work/upstream-native-ci/shard.json','.work/upstream-native-ci-prepare-resources.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
      # Native build-time evidence only. A standard public Linux runner, one
      # process-tree resource boundary and one CTest job; no storage uploads.
