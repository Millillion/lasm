name: Recheck unchanged candidate on native macOS
on:
  workflow_dispatch:
    inputs:
      candidate-version:
        description: Exact already packed package version
        type: string
        required: true
      candidate-cache-key:
        description: Exact candidate cache key
        type: string
        required: true
      candidate-sha256:
        description: SHA-256 of the unchanged archive
        type: string
        required: true
permissions:
  contents: read
jobs:
  darwin-x64:
    uses: ./.github/workflows/node-darwin-consumer.yml
    with:
      runner: macos-15-intel
      architecture: x64
      candidate-version: ${{ inputs.candidate-version }}
      cache-key: ${{ inputs.candidate-cache-key }}
      sha256: ${{ inputs.candidate-sha256 }}
  darwin-arm64:
    uses: ./.github/workflows/node-darwin-consumer.yml
    with:
      runner: macos-15
      architecture: arm64
      candidate-version: ${{ inputs.candidate-version }}
      cache-key: ${{ inputs.candidate-cache-key }}
      sha256: ${{ inputs.candidate-sha256 }}
