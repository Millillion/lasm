name: Native installed macOS Node consumer
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      architecture:
        required: true
        type: string
      cache-key:
        required: true
        type: string
      sha256:
        required: true
        type: string
      candidate-version:
        type: string
        default: 0.1.0-experimental.37
permissions:
  contents: read
jobs:
  installed:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 100
    env:
      LASM_CANDIDATE_SHA256: ${{ inputs.sha256 }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      LASM_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify native host and monitor controls
        run: |
          node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'darwin-'+process.env.EXPECTED_ARCHITECTURE)"
          node scripts/ci/check-darwin-guard.mjs
          node scripts/full-lean/run-bounded.mjs --memory-mib 512 --report .work/darwin-isolation-resources.json -- node scripts/ci/check-darwin-isolation.mjs
          node scripts/full-lean/run-bounded.mjs --memory-mib 512 --report .work/darwin-directory-resources.json -- node --test test/native-directory.test.mjs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/node-candidate/lasm-compiler-${{ inputs.candidate-version }}.tgz
          key: ${{ inputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Cold npm install, real npx commands, offline reuse and independent deployment
        run: node scripts/ci/run-node-darwin.mjs
      - name: Preserve acceptance evidence
        if: always()
        run: |
          node -e "const f=require('node:fs');for(const p of ['.work/darwin-guard-normal.json','.work/darwin-guard-cleanup.json','.work/darwin-guard-below-cap-stop.json','.work/darwin-isolation-resources.json','.work/darwin-directory-resources.json','.work/darwin-isolation-control.json','.work/node-darwin-acceptance/result.json','.work/node-darwin-resources.json','.work/node-darwin-disk.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
