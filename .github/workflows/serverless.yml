name: Serverless platforms
# Phase 6: backs every function-platform claim (README "Supported platforms",
# docs/deploy/) with the platform's own local runtime or emulator. Linux
# runners only, free runners only, no cloud accounts or deployments, ever.
# The sample applications are the `lasm init` server templates (hono, express,
# std-http), built with a candidate, plus any sources changed since main
# (scripts/serverless/overlay-candidate.mjs; none on main), and packaged with
# `lasm package`. Dispatch it for a candidate (run by hand: Linux runners only).
#   - AWS Lambda zip (nodejs24.x) and Lambda@Edge zip: AWS's Lambda Node 24
#     image and its Runtime Interface Emulator, x86_64 and arm64, with API
#     Gateway REST/HTTP API, function URL, ALB and CloudFront events; AWS SAM
#     CLI `sam local invoke` and `sam local start-api`; size limits; cold starts.
#   - Vercel (x64): `vercel build` offline; the function under Vercel's own
#     Node launcher (@vercel/node) in the Lambda Node 24 image; `vercel dev`
#     is recorded (it needs a login).
#   - Netlify (x64): `netlify build --offline` (the deploy zip), `netlify dev
#     --offline`, and the deploy zip in the Lambda Node 24 image with Netlify's
#     bundled bootstrap.
#   - Azure Functions (x64): Azure Functions Core Tools `func start`.
#   - Google Cloud Functions (x64): the Functions Framework, and the source
#     built by Google Cloud's buildpacks (pack, google-24 builder).
#   - Alpine/musl (x64, arm64): node:24-alpine and node:26-alpine, including
#     Std.Http without tzdata (Lasm's UTC fallback) and with it.
#   - gVisor (x64): Docker with gVisor's runsc runtime (DigitalOcean App
#     Platform's sandbox).
on:
  workflow_dispatch:
    inputs:
      candidate-release:
        description: Release holding the candidate (default scripts/ci/platform-candidate.json)
        type: string
        default: ""
      sha256:
        type: string
        default: ""
      candidate-version:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: serverless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: node --test --test-concurrency=1 test/serverless.test.mjs test/init.test.mjs test/cli-arguments.test.mjs test/native-application-bundle.test.mjs test/application-output.test.mjs
  input:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # read the candidate's draft release
    outputs:
      version: ${{ steps.selected.outputs.version }}
      node24: ${{ steps.selected.outputs.node24 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the candidate
        id: selected
        env:
          INPUT_VERSION: ${{ inputs.candidate-version }}
          INPUT_SHA256: ${{ inputs.sha256 }}
          INPUT_RELEASE: ${{ inputs.candidate-release }}
        run: node scripts/platform/select.mjs
      - name: Fetch and verify the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          LASM_CANDIDATE_SHA256: ${{ steps.selected.outputs.sha256 }}
          LASM_CANDIDATE_VERSION: ${{ steps.selected.outputs.version }}
          LASM_CANDIDATE_RELEASE: ${{ steps.selected.outputs.release }}
        run: node scripts/ci/fetch-node-candidate.mjs
      - name: Overlay this branch's sources
        run: |
          git fetch --no-tags origin main
          node scripts/serverless/overlay-candidate.mjs ".work/node-candidate/lasm-compiler-${{ steps.selected.outputs.version }}.tgz" .work/overlay/lasm-compiler-overlay.tgz .work/overlay/overlay.json origin/main
      - uses: actions/upload-artifact@v7
        with:
          name: serverless-candidate
          path: .work/overlay
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  functions:
    needs: input
    name: functions ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, sam: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, sam: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.input.outputs.node24 }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: serverless-candidate
          path: .work/overlay
      - name: Build the server templates and package them (lasm init, npm run build, npm run package:*)
        run: node scripts/serverless/build-apps.mjs .work/overlay/lasm-compiler-overlay.tgz "$RUNNER_TEMP/apps"
      - name: Lambda zip and Lambda@Edge zip in the Lambda Node 24 image (Runtime Interface Emulator)
        run: node scripts/serverless/run-lambda.mjs "$RUNNER_TEMP/apps/apps.json" .work/lambda.json --compare-lwa public.ecr.aws/awsguru/aws-lambda-adapter:1.1.0
      - name: Install AWS SAM CLI 1.170.0 (official installer)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sam.zip" https://github.com/aws/aws-sam-cli/releases/download/v1.170.0/aws-sam-cli-linux-${{ matrix.sam }}.zip
          unzip -q "$RUNNER_TEMP/sam.zip" -d "$RUNNER_TEMP/sam-installer"
          "$RUNNER_TEMP/sam-installer/install" --install-dir "$RUNNER_TEMP/sam" --bin-dir "$RUNNER_TEMP/sam-bin"
          "$RUNNER_TEMP/sam-bin/sam" --version
      - name: sam local invoke and sam local start-api (no AWS credentials)
        run: node scripts/serverless/run-sam.mjs "$RUNNER_TEMP/apps/apps.json" .work/sam.json "$RUNNER_TEMP/sam-bin/sam"
      - name: Install the Vercel and Netlify CLIs (pinned)
        if: always() && matrix.arch == 'x64'
        run: npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund vercel@65.2.0 netlify-cli@27.14.2
      - name: Vercel (vercel build offline; Vercel's Node launcher in the Lambda Node 24 image)
        if: always() && matrix.arch == 'x64' && hashFiles('.work/lambda.json') != ''
        run: node scripts/serverless/run-vercel.mjs "$RUNNER_TEMP/apps/apps.json" .work/vercel.json "$RUNNER_TEMP/tools/node_modules/.bin/vercel" "$RUNNER_TEMP/tools/node_modules"
      - name: Netlify (netlify build and netlify dev offline; the deploy zip in the Lambda Node 24 image)
        if: always() && matrix.arch == 'x64' && hashFiles('.work/lambda.json') != ''
        run: node scripts/serverless/run-netlify.mjs "$RUNNER_TEMP/apps/apps.json" .work/netlify.json "$RUNNER_TEMP/tools/node_modules/.bin/netlify"
      - name: Install Azure Functions Core Tools 4.16.0 and pack 0.38.2 (pinned)
        if: always() && matrix.arch == 'x64'
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund azure-functions-core-tools@4.16.0
          curl -fsSL -o "$RUNNER_TEMP/pack.tgz" https://github.com/buildpacks/pack/releases/download/v0.38.2/pack-v0.38.2-linux.tgz
          tar -xzf "$RUNNER_TEMP/pack.tgz" -C "$RUNNER_TEMP/tools"
      - name: Azure Functions (func start) and Google Cloud Functions (Functions Framework, buildpacks)
        if: always() && matrix.arch == 'x64' && hashFiles('.work/lambda.json') != ''
        run: node scripts/serverless/run-hosted.mjs "$RUNNER_TEMP/apps/apps.json" .work/hosted.json --func "$RUNNER_TEMP/tools/node_modules/.bin/func" --pack "$RUNNER_TEMP/tools/pack"
      - name: Alpine/musl (node:24-alpine, node:26-alpine)
        if: always() && hashFiles('.work/lambda.json') != ''
        run: node scripts/serverless/run-linux-variants.mjs "$RUNNER_TEMP/apps/apps.json" .work/alpine.json --images node:24.22.1-alpine,node:26.12.1-alpine
      - name: Install gVisor release-20261019.0 as a Docker runtime
        if: always() && matrix.arch == 'x64'
        run: |
          url=https://storage.googleapis.com/gvisor/releases/release/20261019.0/x86_64
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.bz2" "$url/gvisor.tar.bz2"
          echo "7cbc2aeeee809dcccfb40e612504a1b76f2c119790cee59e482f7b35428cccc4f71705e7e322442d07d1f7d29b5d9e72e31319fc3088d6dcbec9fc7c1f0d8881  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/gvisor" && tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP/gvisor"
          sudo install -m 755 "$RUNNER_TEMP/gvisor/runsc" "$RUNNER_TEMP/gvisor/containerd-shim-runsc-v1" /usr/local/bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          runsc --version
          docker run --rm --runtime=runsc node:24.22.1-bookworm-slim node -e "console.log(require('os').release())"
      - name: gVisor (docker --runtime=runsc, node:24-bookworm-slim)
        if: always() && matrix.arch == 'x64' && hashFiles('.work/lambda.json') != ''
        run: node scripts/serverless/run-linux-variants.mjs "$RUNNER_TEMP/apps/apps.json" .work/gvisor.json --images node:24.22.1-bookworm-slim --runtime runsc
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p .work/evidence
          cp .work/overlay/overlay.json .work/evidence/ 2>/dev/null || true
          [ -f "$RUNNER_TEMP/apps/apps.json" ] && cp "$RUNNER_TEMP/apps/apps.json" .work/evidence/apps.json
          for f in .work/lambda.json .work/sam.json .work/vercel.json .work/netlify.json .work/hosted.json .work/alpine.json .work/gvisor.json; do [ -f "$f" ] && cp "$f" .work/evidence/; done
          node -e "for (const f of ['.work/lambda.json']) { try { const r = JSON.parse(require('fs').readFileSync(f)); console.log(JSON.stringify(r.runs.map(x => ({ app: x.app, target: x.target, ok: x.ok, zipBytes: x.zipBytes, unzippedBytes: x.unzippedBytes, coldStarts: x.coldStarts, warmMedianMs: x.warmMedianMs, memory: x.memoryUsage })), null, 1)); } catch {} }"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serverless-functions-${{ matrix.arch }}
          path: .work/evidence
          retention-days: 14
          if-no-files-found: ignore
