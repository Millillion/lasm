name: Evidence page
# The public test-evidence page (docs/TESTING.md#the-test-evidence-page):
# scripts/evidence/page.mjs reads the repository and the latest CI results
# (GitHub API and job logs) and writes content/learn/test-evidence.md, which the
# Millillion website publishes under Learn, and docs/evidence/test-evidence.json.
# Monday to Saturday at 10:41 UTC (never on a Sunday, US Eastern time), after the nightly tier (01:07 to 09:17 UTC) and the
# evidence levels (08:23), and by hand. The page changes every night (its
# timestamp and run links), so it is committed straight to main, as
# release-benchmarks.yml commits docs/BENCHMARKS.md, and not by pull request:
# a PR opened with the workflow token starts no checks and would wait for a
# person every night (docs/DECISIONS.md, 2026-11-07). The commit touches only
# those two files, after the content check they would get on a PR
# (scripts/content/index.mjs --check). The website's hourly sync-content.yml
# then pins the new content commit; with a WEBSITE_SYNC_TOKEN secret (actions:
# write on Millillion/website) this workflow dispatches it at once.
# Pull requests that change the generator run it without committing.
on:
  schedule:
    # Never on a Sunday in US Eastern time: 10:41 UTC is 05:41 or 06:41 ET, so skip Sunday UTC.
    - cron: '41 10 * * 1-6'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/evidence-page.yml, 'scripts/evidence/**', scripts/ci/sunday-guard.mjs, test/evidence-page.test.mjs]
permissions:
  contents: read
concurrency:
  group: evidence-page-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  sunday:
    # Nothing runs on a scheduled Sunday in New York (sunday-guard.yml).
    uses: ./.github/workflows/sunday-guard.yml

  page:
    needs: sunday
    if: needs.sunday.outputs.skip != 'true' && (github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release pages in content/index.json take their date from git history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Generator tests
        run: node --test test/evidence-page.test.mjs test/evidence-levels.test.mjs
      - name: Generate the page from the repository and CI results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/evidence/page.mjs --write --check
      - name: The content check a pull request would run
        run: node scripts/content/index.mjs --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-page-${{ github.run_id }}
          path: |
            content/learn/test-evidence.md
            docs/evidence/test-evidence.json
          retention-days: 30
      - name: Commit the page to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp content/learn/test-evidence.md docs/evidence/test-evidence.json "$RUNNER_TEMP/"
          outcome=failed
          # Rebase-safe, as release-benchmarks.yml: start from the newest main on
          # every attempt and put the generated files on it; a lost race retries.
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/test-evidence.md" content/learn/test-evidence.md
            cp "$RUNNER_TEMP/test-evidence.json" docs/evidence/test-evidence.json
            git add content/learn/test-evidence.md docs/evidence/test-evidence.json
            if git diff --cached --quiet; then outcome=unchanged; break; fi
            git commit -q -m "Evidence page from CI ($(date -u +%Y-%m-%d))" -m "Generated by scripts/evidence/page.mjs in evidence-page.yml run ${{ github.run_id }}."
            if git push origin HEAD:main; then outcome=pushed; break; fi
            sleep $((attempt * 10))
          done
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Outcome: $outcome; $(git log -1 --format='%H %s')" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$outcome" != failed
      - name: Ask the website to sync now
        if: steps.commit.outputs.outcome == 'pushed'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          if [ "$(TZ=America/New_York date +%u)" = 7 ]; then echo "Sunday in US Eastern time: no automatic dispatch."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "No WEBSITE_SYNC_TOKEN: the website's hourly sync-content.yml picks the page up within the hour."; exit 0; fi
          gh workflow run sync-content.yml --repo Millillion/website
