name: Native application module data controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-module-data-${{ github.ref }}
  cancel-in-progress: false

# Native compiler and data-layout controls on free standard public runners.
# No caches or artifact uploads; installed Wasm acceptance remains separate.
jobs:
  metadata:
    if: github.event.repository.visibility == 'public'
    runs-on: ${{ matrix.runner }}
    name: Module data ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check native engine and enable process-tree guard
        run: |
          node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'${{ matrix.platform }}')"
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Guarded module-data unit controls
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 512 --report .work/module-data-units-resources.json -- node --max-old-space-size=128 --test --test-concurrency=1 test/application-metadata.test.mjs test/application-output.test.mjs
      - name: Guarded native Lake and relocated import control
        run: node scripts/full-lean/run-bounded.mjs --report .work/module-data-native-resources.json -- node integration/application-module-data.mjs .work/module-data-native
      - name: Preserve results in logs
        if: always()
        run: |
          node -e "const fs=require('node:fs');for(const p of ['.work/module-data-units-resources.json','.work/module-data-native-resources.json','.work/module-data-native/result.json'])if(fs.existsSync(p))console.log(p+'\n'+fs.readFileSync(p,'utf8'))"
