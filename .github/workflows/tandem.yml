name: Tandem
# examples/tandem, a collaborative text editor in Lean (Fugue's sequence CRDT),
# built as a user builds it (npm ci with the published @lasm/cli pinned in its
# package.json):
# - proofs: every proposition of Proofs/Spec.lean has its theorem, every
#   theorem in Proofs/ compiles and uses only propext, Classical.choice and
#   Quot.sound (no sorry, no native_decide), and no definition reachable from
#   the code that handles untrusted input is partial, unsafe or a panic, with
#   Lasm's managed Lean; PROOFS.md, SPEC.md and the stated theorem count agree
#   with what was checked; then the export of the proofs is replayed by Lean's
#   kernel and every external checker Lean 4.35.0 ships (`lake check --paranoid`).
# - node: the Node sync server (node:sqlite, WebSockets through `ws`) on Node
#   24 and 26: the protocol tests (HTTP sync, long-poll, WebSocket pushes,
#   concurrent writers, a SIGKILL), the differential test against Yjs 13.6.33
#   (random histories with partitions, reordering, duplication and delivery
#   out of causal order, run on the compiled Lean and on Yjs), and the live
#   simulation (the browser's replica logic in several processes over an
#   unreliable network, the server killed and restarted mid-run);
# - fuzz: the protocol fuzzer for three minutes against the Node build
#   (HTTP and WebSockets; seeded; failing inputs uploaded).
# Local runtimes only: no account, nothing deployed, CI=1. Free runners only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tandem.yml'
      - 'examples/tandem/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tandem.yml'
      - 'examples/tandem/**'
permissions:
  contents: read
concurrency:
  group: tandem-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run proofs (no sorry; only Lean's standard axioms; total input handlers)
        working-directory: examples/tandem
        run: |
          if grep -rnw 'sorry\|native_decide' Tandem Proofs; then echo "::error::sorry or native_decide in the sources"; exit 1; fi
          npm run proofs
      - name: lake check --paranoid (Lean's kernel and the external checkers)
        working-directory: examples/tandem
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
          npm run proofs:paranoid
  node:
    name: Protocol, Yjs and simulation on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run build (the server, the batch driver, the simulated clients)
        working-directory: examples/tandem
        run: |
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:batch
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:clients
      - name: The protocol tests
        working-directory: examples/tandem
        run: node test/protocol.mjs --name "node-${{ matrix.node }}"
      - name: The differential test against Yjs (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/differential.mjs --histories 2000
      - name: The live simulation (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/simulate.mjs --rounds 5 --name "node-${{ matrix.node }}"
  fuzz:
    name: The protocol fuzzer (3 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/tandem
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The fuzzer (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/fuzz.mjs --seconds 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tandem-fuzz
          path: examples/tandem/test-results/
          retention-days: 14
          if-no-files-found: ignore
