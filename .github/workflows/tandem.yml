name: Tandem
# examples/tandem, a collaborative text editor in Lean (Fugue's sequence CRDT),
# built as a user builds it (npm ci with the published @lasm/cli pinned in its
# package.json):
# - proofs: every proposition of Proofs/Spec.lean has its theorem, every
#   theorem in Proofs/ compiles and uses only propext, Classical.choice and
#   Quot.sound (no sorry, no native_decide), and no definition reachable from
#   the code that handles untrusted input is partial, unsafe or a panic, with
#   Lasm's managed Lean; PROOFS.md, SPEC.md and the stated theorem count agree
#   with what was checked; then the export of the proofs is replayed by Lean's
#   kernel and every external checker Lean 4.35.0 ships (`lake check --paranoid`).
# - node: the Node sync server (node:sqlite, WebSockets through `ws`) on Node
#   24 and 26: the protocol tests (HTTP sync, long-poll, WebSocket pushes,
#   concurrent writers, a SIGKILL), the differential test against Yjs 13.6.33
#   (random histories with partitions, reordering, duplication and delivery
#   out of causal order, run on the compiled Lean and on Yjs), and the live
#   simulation (the browser's replica logic in several processes over an
#   unreliable network, the server killed and restarted mid-run);
# - fuzz: the protocol fuzzer for three minutes against the Node build
#   (HTTP and WebSockets; seeded; failing inputs uploaded);
# - dst: the deterministic simulation (test/dst.mjs, on scripts/sim): the
#   editor's own state machine in several tabs and the server's own handler,
#   compiled, in a simulated world of network, database, storage and users
#   with faults, decided by one seed; 30 fixed seeds, each run twice to check
#   that it replays exactly (the nightly runs random seeds for 30 minutes);
# - e2e: the editor (the Lasm.UI app) in Chromium, Firefox and WebKit
#   (Playwright, no retries): typing, two browsers at once (live, and
#   concurrently at one place), offline then reconnecting, a reload while
#   offline, the caret kept beside its text, no script error or CSP
#   violation; and in Chromium against Workers (wrangler dev), where the
#   editor long-polls.
# Local runtimes only: no account, nothing deployed, CI=1. Free runners only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tandem.yml'
      - 'examples/tandem/**'
      - 'scripts/sim/**'
      - 'scripts/equivalence/traffic.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tandem.yml'
      - 'examples/tandem/**'
      - 'scripts/sim/**'
      - 'scripts/equivalence/traffic.mjs'
permissions:
  contents: read
concurrency:
  group: tandem-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run proofs (no sorry; only Lean's standard axioms; total input handlers)
        working-directory: examples/tandem
        run: |
          if grep -rnw 'sorry\|native_decide' Tandem Proofs; then echo "::error::sorry or native_decide in the sources"; exit 1; fi
          npm run proofs
      - name: bubblewrap for Lake's sandbox (cached .deb files, else the apt mirror)
        timeout-minutes: 10
        uses: ./.github/actions/apt-cache
        with:
          name: bubblewrap
          run: command -v bwrap || sudo apt-get install -y --no-install-recommends bubblewrap
      - name: lake check --paranoid (Lean's kernel and the external checkers)
        working-directory: examples/tandem
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run proofs:paranoid
  node:
    name: Protocol, Yjs and simulation on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run build (the server, the batch driver, the simulated clients)
        working-directory: examples/tandem
        run: |
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:batch
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:clients
      - name: The protocol tests (the HTTP traffic recorded for target equivalence)
        working-directory: examples/tandem
        run: node test/protocol.mjs --name "node-${{ matrix.node }}" --equivalence
      - name: Target equivalence (the protocol traffic against test/equivalence/protocol.json; the normalizer's self-test first)
        if: ${{ !cancelled() }}
        working-directory: examples/tandem
        run: |
          node test/equivalence.mjs self-test > /dev/null
          node test/equivalence.mjs compare "node-${{ matrix.node }}"
      - name: The differential test against Yjs (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/differential.mjs --histories 2000
      - name: The live simulation (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/simulate.mjs --rounds 5 --name "node-${{ matrix.node }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tandem-node-${{ matrix.node }}
          path: examples/tandem/test-results/
          retention-days: 14
          if-no-files-found: ignore
  fuzz:
    name: The protocol fuzzer (3 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/tandem
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The fuzzer (seeded; the seed is printed first)
        working-directory: examples/tandem
        run: node test/fuzz.mjs --seconds 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tandem-fuzz
          path: examples/tandem/test-results/
          retention-days: 14
          if-no-files-found: ignore
  dst:
    name: Deterministic simulation (fixed seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: The harness's own tests (scripts/sim)
        run: node --test test/sim.test.mjs
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: npm run build:sim
        working-directory: examples/tandem
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:sim
      - name: The simulation, 30 fixed seeds, each replayed (a failure prints its seed and a repro command)
        working-directory: examples/tandem
        run: node test/dst.mjs --seeds 30 --check-determinism --keep-going
      - name: The simulation, 10 fixed seeds with heavy faults
        if: ${{ !cancelled() }}
        working-directory: examples/tandem
        run: node test/dst.mjs --seeds 10 --first 1001 --faults heavy --keep-going
      - name: The simulation, regression seeds (each once failed in the nightly; #190)
        if: ${{ !cancelled() }}
        working-directory: examples/tandem
        run: node test/dst.mjs --keep-going --faults heavy --seed 1496820401
  e2e:
    name: The editor on ${{ matrix.server }}, ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, server: node }
          - { browser: firefox, server: node }
          - { browser: webkit, server: node }
          - { browser: chromium, server: workers }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - uses: ./.github/actions/process-guard
      - name: npm ci
        working-directory: examples/tandem
        run: npm ci --no-audit --no-fund
      - name: Wrangler 4.152.0 (Workers only)
        if: matrix.server == 'workers'
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund wrangler@4.152.0
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: npm run build (the browser app, then the server embedding it)
        working-directory: examples/tandem
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run ${{ matrix.server == 'workers' && 'build:workers' || 'build' }}
      - name: The pinned Playwright's ${{ matrix.browser }}, with its system packages
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browser }}
      - name: The end-to-end tests
        working-directory: examples/tandem
        env:
          BROWSERS: ${{ matrix.browser }}
          E2E_NAME: ${{ matrix.server }}-${{ matrix.browser }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ "${{ matrix.server }}" = workers ]; then
            export E2E_SERVER="wrangler dev --port 4400 --ip 127.0.0.1 --persist-to $RUNNER_TEMP/d1"
          fi
          npm run test:e2e -- --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tandem-e2e-${{ matrix.server }}-${{ matrix.browser }}
          path: examples/tandem/test-results/
          retention-days: 14
          if-no-files-found: warn
