name: Tiered Lean distribution
# Maintainer-only: repackage each pinned Lean archive into per-platform binaries
# and shared module-data archives, prove the shared archives are byte-identical
# across platforms and deterministic, run them natively against the complete
# upstream toolchain, then optionally retain them as public release assets.
# Every run also builds the per-platform C tier (Lean's clang as `cc`, headers
# and link libraries, plus the pinned inputs of scripts/lean-dist/c-tier-sources.json)
# and checks it natively. scope=c builds and publishes only the C tier; its
# binaries archive must equal the published one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pinned Lean version in src/toolchains.json
        type: string
        default: 4.35.0
      catalog:
        description: Catalog naming the pinned upstream archives (a maintainer pin file before the product catalog adopts the release)
        type: string
        default: src/toolchains.json
      tag:
        description: Release tag for the archives (only used when publishing)
        type: string
        default: lean-4.35.0-tiers-v1
      scope:
        description: all (binaries, module data and C tier) or c (C tier only)
        type: choice
        options: [all, c]
        default: all
      publish:
        description: Create the public release after every check passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lean-tiers
  cancel-in-progress: false
jobs:
  repackage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
    env:
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ inputs.version }}
      CATALOG: ${{ inputs.catalog }}
      SCOPE: ${{ inputs.scope }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Download the pinned C tier inputs
        run: |
          mkdir -p .work/lean-tiers/c-dl
          node -e '
            const s = require("./scripts/lean-dist/c-tier-sources.json")[process.env.VERSION];
            for (const p of [s.resourceHeaders, ...(s.libc[process.env.PLATFORM]?.packages ?? [])]) console.log(p.url + " " + p.name);' |
          while read -r url name; do
            curl --fail --location --retry 5 --retry-all-errors --proto '=https' --output ".work/lean-tiers/c-dl/$name" "$url"
          done
          ls -l .work/lean-tiers/c-dl
      - name: Download the pinned archive
        run: |
          url=$(node -p "require(require('path').resolve(process.env.CATALOG)).lean[process.env.VERSION].artifacts[process.env.PLATFORM].url")
          mkdir -p .work/lean-tiers/dl
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --output .work/lean-tiers/dl/upstream "$url"
          df -h .
      - name: Repackage twice and record digests
        # Shared data is written once, from linux-x64; every other platform
        # packs it into a digest sink so equality is checked without storage.
        # The memory cap includes the staged files' page cache.
        run: |
          data=hash; [ "$PLATFORM" = linux-x64 ] && data=write
          [ "$SCOPE" = c ] && data=none
          node scripts/full-lean/run-bounded.mjs --memory-mib 8192 --report .work/lean-tiers-$PLATFORM-resources.json -- \
            node scripts/lean-dist/build-tiers.mjs --catalog "$CATALOG" --version "$VERSION" --platform "$PLATFORM" --archive .work/lean-tiers/dl/upstream \
              --out .work/lean-tiers/out --work .work/lean-tiers/work --data $data --twice --c --c-download .work/lean-tiers/c-dl \
              --sources-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          rm -rf .work/lean-tiers/dl/upstream .work/lean-tiers/c-dl
          if [ "$SCOPE" = c ]; then
            # The C tier excludes the published binaries archive's files; it must be that archive.
            node -e '
              const fs = require("fs"), path = require("path");
              const catalog = JSON.parse(fs.readFileSync(path.resolve(process.env.CATALOG)));
              const published = catalog.lean[process.env.VERSION].tiers.bin[process.env.PLATFORM];
              const report = JSON.parse(fs.readFileSync(".work/lean-tiers/out/report-" + process.env.PLATFORM + ".json"));
              const bin = report.archives.find(a => a.piece === "bin");
              if (bin.sha256 !== published.sha256 || bin.bytes !== published.bytes) throw new Error("binaries archive differs from the published one");'
          fi
          ls -l .work/lean-tiers/out
          { echo "### $PLATFORM"; echo '```'; node -e "for (const a of require('./.work/lean-tiers/out/report-' + process.env.PLATFORM + '.json').archives) console.log(a.name, a.bytes, a.sha256, a.written ? 'written' : 'digest')"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tiers-${{ matrix.platform }}
          path: .work/lean-tiers/out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  shared:
    needs: repackage
    if: inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tiers-*
          path: .work/lean-tiers/all
          merge-multiple: true
      - name: Require identical shared archives and the size ceiling
        run: |
          ls -l .work/lean-tiers/all
          node scripts/lean-dist/catalog.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.tag }}/" .work/lean-tiers/all/report-*.json > .work/lean-tiers/tiers.json
          node -e "
            const fs = require('fs'), entry = JSON.parse(fs.readFileSync('.work/lean-tiers/tiers.json'));
            const all = [...Object.values(entry.bin), ...entry.core, ...entry.extended];
            for (const a of all) {
              const size = fs.statSync('.work/lean-tiers/all/' + a.name).size;
              if (size !== a.bytes) throw new Error(a.name + ' size mismatch');
              if (a.bytes > 150 * 1024 * 1024) throw new Error(a.name + ' exceeds 150 MiB');
            }
            console.log(JSON.stringify(entry, null, 2));"
          { echo '### Catalog entry'; echo '```json'; cat .work/lean-tiers/tiers.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  native:
    needs: repackage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux cgroup accounting includes the extracted trees' page cache.
          - { platform: linux-x64, runner: ubuntu-24.04, memory: 8192 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, memory: 8192 }
          - { platform: darwin-x64, runner: macos-15-intel, memory: 6144 }
          - { platform: darwin-arm64, runner: macos-15, memory: 5120 }
          - { platform: win32-x64, runner: windows-2025, memory: 6144 }
    env:
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ inputs.version }}
      CATALOG: ${{ inputs.catalog }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: tiers-linux-x64
          path: .work/lean-tiers/check
      - uses: actions/download-artifact@v8
        if: matrix.platform != 'linux-x64'
        with:
          name: tiers-${{ matrix.platform }}
          path: .work/lean-tiers/check
      - name: Check the C tier natively (Lean's clang as cc, headers, archiver, linker)
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib ${{ matrix.memory }} --report .work/lean-tiers-c-resources.json -- \
            node scripts/lean-dist/check-c-tier.mjs --platform "$PLATFORM" --tiers .work/lean-tiers/check --work .work/lean-tiers/c-check --report .work/lean-tiers/c-check.json
          { echo "### $PLATFORM C tier"; echo '```json'; cat .work/lean-tiers/c-check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf .work/lean-tiers/c-check
      - name: Download the complete pinned archive for comparison
        if: inputs.scope == 'all'
        run: |
          url=$(node -p "require(require('path').resolve(process.env.CATALOG)).lean[process.env.VERSION].artifacts[process.env.PLATFORM].url")
          curl --fail --location --retry 5 --retry-all-errors --proto '=https' --output .work/lean-tiers/upstream "$url"
      - name: Extract the tiers and the complete archive
        if: inputs.scope == 'all'
        run: |
          node scripts/lean-dist/check-tiers.mjs --phase extract --catalog "$CATALOG" --version "$VERSION" --platform "$PLATFORM" --tiers .work/lean-tiers/check \
            --upstream .work/lean-tiers/upstream --work .work/lean-tiers/native
          rm -f .work/lean-tiers/upstream
      - name: Run the tiers natively and compare generated C with the complete toolchain
        if: inputs.scope == 'all'
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib ${{ matrix.memory }} --report .work/lean-tiers-native-resources.json -- \
            node scripts/lean-dist/check-tiers.mjs --phase check --catalog "$CATALOG" --version "$VERSION" --platform "$PLATFORM" --tiers .work/lean-tiers/check \
              --work .work/lean-tiers/native --report .work/lean-tiers/native.json
          { echo "### $PLATFORM"; echo '```json'; cat .work/lean-tiers/native.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [shared, native]
    if: always() && inputs.publish && needs.native.result == 'success' && (needs.shared.result == 'success' || inputs.scope == 'c')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tiers-*
          path: .work/lean-tiers/all
          merge-multiple: true
      - name: Retain the verified archives as public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          cd .work/lean-tiers/all
          if [ "${{ inputs.scope }}" = c ]; then
            rm -f *-bin.tar.zst
            node ../../../scripts/lean-dist/catalog.mjs --c-only "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" report-*.json > tiers.json
          else
            node ../../../scripts/lean-dist/catalog.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" report-*.json > tiers.json
          fi
          # The exact (L)GPL sources of what the archives contain in binary or header
          # form (scripts/lean-dist/source-archives.json), mirrored beside them.
          node -e '
            const items = require("../../../scripts/lean-dist/source-archives.json")[process.env.VERSION];
            for (const item of items.filter(i => i.archives.some(a => a === "bin" || a === "c"))) console.log(item.url + " " + item.name + " " + item.sha256);' > sources.txt
          mkdir sources
          while read -r url name sha; do
            curl --fail --location --retry 5 --retry-all-errors --output "sources/$name" "$url"
            echo "$sha  sources/$name" | sha256sum -c -
          done < sources.txt
          sources=$(cut -d' ' -f2 sources.txt | sed 's|^|sources/|' | tr '\n' ' ')
          { sha256sum *.tar.zst; (cd sources && sha256sum *); } > SHA256SUMS
          cat > notes.md <<EOF
          Tiered Lean ${{ inputs.version }} archives for Lasm, produced by run ${GITHUB_RUN_ID} from ${GITHUB_SHA}.
          Each binaries and module-data archive is an unmodified subset of the pinned upstream Lean release. Each C tier archive (*-c.tar.zst) holds an unmodified subset (Lean's clang, linker, headers and link libraries) plus `cc` and pinned, unmodified third-party headers (clang resource headers; glibc/Linux or MinGW-w64 headers). See the NOTICE inside each archive.
          The per-platform report-*.json files record the upstream archive digests, archive digests and determinism checks.
          The remaining assets are the exact corresponding sources of the (L)GPL components (GNU MP, the GNU C Library, GCC's runtime, the Linux UAPI headers, MinGW-w64) and Lean's own source, mirrored from their upstream URLs; each archive's NOTICE lists them (scripts/lean-dist/source-archives.json).
          EOF
          printf '\nSource revision: %s\n' "$GITHUB_SHA" >> notes.md
          RELEASE_TARGET="$GITHUB_SHA"; [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA" ] || RELEASE_TARGET="$GITHUB_REF_NAME"  # GitHub refuses non-tip SHAs as release targets
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title "$TAG" --notes-file notes.md \
            *.tar.zst $sources report-*.json tiers.json SHA256SUMS
