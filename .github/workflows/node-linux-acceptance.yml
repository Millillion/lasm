name: Native Node installed-package acceptance
on:
  push:
    branches: [main]
    paths: ['src/**', 'bin/**', 'package*.json', 'scripts/package-node-release.mjs', 'scripts/bundle-installer.mjs', 'scripts/candidate-readme.mjs']
  workflow_dispatch:
    inputs:
      candidate-version:
        description: Unique version for the newly packed candidate
        required: true
        type: string
        default: 0.1.0-experimental.47
      validation-scope:
        description: Target a Windows repair or run the complete acceptance matrix
        type: choice
        options: [all, windows-x64, windows-arm64]
        default: all
permissions:
  contents: read
concurrency:
  group: node-installed-acceptance-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  faults:
    uses: ./.github/workflows/installer-faults.yml
  package:
    permissions:
      contents: write
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      candidate-release: node-package-${{ github.run_id }}
    env:
      LASM_CANDIDATE_VERSION: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Check Node and Lean acceptance pins
        run: node scripts/ci/check-acceptance-versions.mjs .work/node-versions.json --node-only
      - name: Focused application and packaging controls
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 1024 --report .work/node-unit-resources.json -- node --max-old-space-size=256 --test --test-concurrency=1 test/candidate-readme.test.mjs test/darwin-resources.test.mjs test/application-output.test.mjs test/application-policy.test.mjs test/application-reachability.test.mjs test/application-symbols.test.mjs test/native-application-bundle.test.mjs test/native-directory.test.mjs test/native-temporary.test.mjs test/application-metadata.test.mjs test/application-support.test.mjs test/application-paths.test.mjs test/windows-tool-paths.test.mjs test/application-launcher.test.mjs test/build-progress.test.mjs test/cli-arguments.test.mjs test/application-files.test.mjs test/application-runtime.test.mjs test/node-cache-controls.test.mjs test/managed-artifacts.test.mjs test/managed-git.test.mjs
      - name: Completed cache advice preserves file contents and excludes deployments
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 256 --report .work/node-cache-advice-resources.json -- python3 -I -B test/tool-cache-advice.test.py
      - name: Download the pinned retained runtime input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/fetch-node-runtime.mjs
      - name: Verify and extract durable runtime under the resource guard
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 --report .work/node-restore-resources.json -- node scripts/ci/restore-node-runtime.mjs
      - name: Pack twice reproducibly
        id: package
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib 2048 --report .work/node-package-resources.json -- /usr/bin/env GITHUB_RUN_ID="$GITHUB_RUN_ID" node scripts/package-node-release.mjs .work/node-candidate .work/node-runtime-restored/runtime .work/node-runtime-restored/native "$(node -p "require('./.work/node-runtime-restored/provenance.json').runtimeManifestSha256")" "$LASM_CANDIDATE_VERSION"
          node -e "const f=require('node:fs'),r=JSON.parse(f.readFileSync('.work/node-candidate/result.json'));f.appendFileSync(process.env.GITHUB_OUTPUT,'sha256='+r.sha256+'\n')"
      - name: Retain exact unaccepted candidate for cache-independent validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/retain-node-candidate.mjs input
      - name: Preserve candidate identity and packing measurements
        if: always()
        run: node -e "const f=require('node:fs');for(const p of ['.work/node-candidate/result.json','.work/node-runtime-restore-result.json','.work/node-restore-resources.json','.work/node-package-resources.json','.work/node-versions.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
  input:
    needs: package
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/node-candidate-input.yml
    with:
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  linux-x64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all'
    needs: [package, input, faults]
    uses: ./.github/workflows/node-linux-consumer.yml
    with:
      runner: ubuntu-24.04
      architecture: x64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  linux-arm64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all'
    needs: [package, input, faults, linux-x64]
    uses: ./.github/workflows/node-linux-consumer.yml
    with:
      runner: ubuntu-24.04-arm
      architecture: arm64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  darwin-x64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all'
    needs: [package, input, faults]
    uses: ./.github/workflows/node-darwin-consumer.yml
    with:
      runner: macos-15-intel
      architecture: x64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  darwin-arm64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all'
    needs: [package, input, faults]
    uses: ./.github/workflows/node-darwin-consumer.yml
    with:
      runner: macos-15
      architecture: arm64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  windows-x64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all' || inputs.validation-scope == 'windows-x64'
    needs: [package, input, faults]
    uses: ./.github/workflows/node-windows-consumer.yml
    with:
      runner: windows-2025
      architecture: x64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  windows-arm64:
    if: github.event_name == 'push' || inputs.validation-scope == 'all' || inputs.validation-scope == 'windows-arm64'
    needs: [package, input, faults]
    uses: ./.github/workflows/node-windows-consumer.yml
    with:
      runner: windows-11-arm
      architecture: arm64
      cache-key: ${{ needs.input.outputs.cache-key }}
      sha256: ${{ needs.package.outputs.sha256 }}
      candidate-release: ${{ needs.package.outputs.candidate-release }}
      candidate-version: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
  candidate:
    if: github.event_name == 'push' || inputs.validation-scope == 'all'
    needs: [package, faults, linux-x64, linux-arm64, darwin-x64, darwin-arm64, windows-x64, windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      LASM_CANDIDATE_VERSION: ${{ inputs.candidate-version || format('0.1.0-experimental.{0}', github.run_id) }}
      LASM_CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
      LASM_CANDIDATE_RELEASE: ${{ needs.package.outputs.candidate-release }}
      LASM_ACCEPTANCE_PLATFORMS: linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64,win32-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Restore authenticated retained package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/fetch-node-candidate.mjs
      - name: Verify the tested archive and prepare its receipt
        run: node scripts/ci/node-candidate-receipt.mjs
      # Draft release assets have no Actions artifact-storage charge. Keep this
      # unpublished and reviewable; npm publication is a separate user decision.
      - name: Retain the tested candidate in an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/retain-node-candidate.mjs tested
