name: Bun and Deno, published packages (Phase 7.5)
# The published @lasm/cli and @lasm/create installed and run with Bun and Deno
# only (Node and npm removed from PATH), as a user does, on all five targets:
# bun add / bunx --bun / bun create @lasm, deno install / deno run -A
# npm:@lasm/cli / npm:@lasm/create, the builds served by Bun and Deno
# (scripts/edge/published-ci.mjs). Skips cleanly until a release (not the 0.0.0
# placeholder) is on the registry; a release before 0.2.0 has no Bun/Deno
# runtime support, so only its installs are checked. Free runners, the public
# registry, no account and no publication.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '@lasm/cli version (default: the latest dist-tag)'
        type: string
        default: ''
  # After every release, and daily (the registry can change without a commit).
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [phase-7, bun-deno-ci]
    paths:
      - '.github/workflows/bun-deno-published.yml'
      - 'scripts/edge/published-ci.mjs'
      - 'scripts/edge/portable-check.mjs'
permissions:
  contents: read
concurrency:
  group: bun-deno-published-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published:
    runs-on: ${{ matrix.runner }}
    name: Published packages with Bun and Deno ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: windows-2025, platform: win32-x64 }
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      BROWSER: 'false'
      LEAN_NUM_THREADS: '2'
      BINARYEN_CORES: '1'
      LASM_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Node runs only this checkout's test driver and resource guard; every
      # Bun and Deno command gets a PATH without node and npm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'${{ matrix.platform }}')"
      - name: Enable process-tree guard (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Pinned Bun and Deno
        run: npm install --prefix .work/host-tools --no-audit --no-fund deno@2.9.6 bun@1.4.4
      - name: Install and run the published packages with Bun and Deno
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/edge/published-ci.mjs "$RUNNER_TEMP/lasm published" .work/host-tools $VERSION
      - name: Keep the results
        if: always()
        run: mkdir -p .work/published-results && cp "$RUNNER_TEMP/lasm published"/*.json .work/published-results/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: published-results-${{ matrix.platform }}
          path: .work/published-results/*.json
          retention-days: 14
