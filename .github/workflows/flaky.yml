name: Flaky test report
# Nightly (docs/TESTING.md#flaky-tests): every workflow run of the last 24 hours
# through the GitHub API; re-runs, jobs that passed only on retry (with the
# tests that failed first), timed-out and cancelled jobs, and the quarantine
# list's ages. Writes the report as an artifact and replaces the body of the
# one open issue labelled `flaky` (opened if there is none).
on:
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flaky-report
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Report the last 24 hours
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The tracking issue is updated from main only; a run on a branch writes the artifact.
        run: node scripts/ci/flaky-report.mjs .work/flaky ${{ github.ref == 'refs/heads/main' && '--issue' || '' }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flaky-report-${{ github.run_id }}
          path: .work/flaky/
          if-no-files-found: warn
          retention-days: 30
