name: CLI models
# The model differential of the CLI's JavaScript (verification/cli/README.md,
# docs/TESTING.md#model-differentials): test/models/cli-differential.mjs runs
# every function that has a Lean model (verification/cli/Lasm/Cli/Model/)
# and the shipped JavaScript on the same generated inputs, 2000 per function,
# and fails on any difference. The proofs about the models are checked by
# library-proofs.yml. On any change to the JavaScript (src/), the models or
# the differential, and on the native launcher whose reading it checks
# (compiled with the system C compiler). Free runner only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cli-models.yml'
      - 'src/**'
      - 'verification/cli/**'
      - 'test/models/**'
      - 'test/helpers/property.mjs'
      - 'native/process-launcher.c'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cli-models.yml'
      - 'src/**'
      - 'verification/cli/**'
      - 'test/models/**'
      - 'test/helpers/property.mjs'
      - 'native/process-launcher.c'
permissions:
  contents: read
concurrency:
  group: cli-models-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      BROWSER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Every Lean model agrees with its JavaScript
        run: node test/models/cli-differential.mjs
