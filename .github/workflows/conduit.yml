name: Conduit
# examples/conduit, the RealWorld app in Lean, built as a user builds it
# (npm ci with the published @lasm/cli pinned in its package.json):
# - api-node: the Node server (node:sqlite) on Node 24 and 26, against the
#   official RealWorld API suite (gothinkster/realworld specs/api/hurl at the
#   commit in test/realworld/PINNED, run unmodified with its own script);
# - api-workers: the Workers build (D1) under `wrangler dev` (local workerd
#   and a local D1 database), against the same suite;
# - api-bun: the Bun build (bun:sqlite), built by Lasm running on Bun,
#   against the same suite;
# - proofs: every theorem in Proofs/ compiles and uses only propext,
#   Classical.choice and Quot.sound (no sorry), with Lasm's managed Lean;
# - e2e-node, e2e-workers: the official RealWorld end-to-end suite
#   (specs/e2e, Playwright, unmodified, fullstack mode) against the
#   server-rendered, hydrated Lasm.UI app: Node on Chromium, Firefox and
#   WebKit; Workers (wrangler dev, local D1) and Bun on Chromium; no retries;
# - platform: every other platform with its own local tooling, one job each
#   (examples/conduit/test/platforms.mjs): Deno; Docker; AWS Lambda .zip and
#   container image (sam local start-api); Vercel Functions (vercel build,
#   Vercel's Node launcher in the Lambda image); Netlify Functions (netlify
#   build and netlify dev, offline); Azure Functions (func start); Google
#   Cloud Functions (Functions Framework); Deno Deploy (Deno KV); Vercel
#   Edge (vercel build, edge-runtime); Netlify Edge (netlify build and
#   netlify dev, Netlify Blobs); Supabase Edge Functions (the Supabase CLI's
#   local stack and functions serve, Postgres); Fastly Compute (Viceroy,
#   Fastly KV); wasi-http on wasmtime serve and Spin (Postgres through
#   PostgREST). Each runs the API suite and the end-to-end
#   suite (Chromium, no retries);
# - pinned: test/realworld is byte-identical to the upstream commit.
# Local runtimes and emulators only: no account, nothing deployed, CI=1.
# Free runners only.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/conduit.yml'
      - 'examples/conduit/**'
  push:
    branches: [main, conduit]
    paths:
      - '.github/workflows/conduit.yml'
      - 'examples/conduit/**'
permissions:
  contents: read
concurrency:
  group: conduit-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: test/realworld matches gothinkster/realworld at the pinned commit
        working-directory: examples/conduit/test/realworld
        run: |
          set -e
          commit=$(sed -n 2p PINNED)
          git init -q "$RUNNER_TEMP/rw" && cd "$RUNNER_TEMP/rw"
          git fetch -q --depth 1 https://github.com/gothinkster/realworld.git "$commit"
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/examples/conduit/test/realworld"
          cmp LICENSE "$RUNNER_TEMP/rw/LICENSE"
          for f in $(find specs -type f); do cmp "$f" "$RUNNER_TEMP/rw/$f"; done
          echo "$(find specs -type f | wc -l) files identical to gothinkster/realworld@$commit"
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: npm ci
        working-directory: examples/conduit
        run: npm ci --no-audit --no-fund
      - name: npm run proofs (no sorry; only Lean's standard axioms)
        working-directory: examples/conduit
        run: |
          if grep -rnw sorry Conduit Proofs; then echo "::error::sorry in the sources"; exit 1; fi
          npm run proofs
  api-node:
    name: API on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/conduit
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: examples/conduit
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: npm test (the official RealWorld API suite)
        working-directory: examples/conduit
        run: node test/api.mjs --name "node-${{ matrix.node }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-api-node-${{ matrix.node }}
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  api-workers:
    name: API on Cloudflare Workers (wrangler dev, local D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci, and the pinned wrangler (with workerd)
        working-directory: examples/conduit
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund wrangler@4.152.0
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: npm run build:workers
        working-directory: examples/conduit
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:workers
      - name: The official RealWorld API suite against wrangler dev
        working-directory: examples/conduit
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node test/api.mjs --name workers --command "wrangler dev --port {port} --ip 127.0.0.1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-api-workers
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  api-bun:
    name: API on Bun (bun:sqlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci, and the pinned Bun
        working-directory: examples/conduit
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund bun@1.4.4
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: npm run build:bun (Lasm running on Bun)
        working-directory: examples/conduit
        run: |
          bun --version
          node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:bun
      - name: The official RealWorld API suite against Bun
        working-directory: examples/conduit
        run: node test/api.mjs --name bun --command "bun bun/main.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-api-bun
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  e2e-node:
    name: E2E on Node, ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: examples/conduit
        run: npm ci --no-audit --no-fund
      - name: npm run build (the browser app, then the Node server embedding it)
        working-directory: examples/conduit
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build
      - name: The pinned Playwright's ${{ matrix.browser }}, with its system packages
        timeout-minutes: 30
        run: |
          npm install --prefix .work/pw --no-audit --no-fund playwright-core@1.63.0
          bash scripts/ci/playwright-install.sh "${{ matrix.browser }}"
      - name: The official RealWorld end-to-end suite
        working-directory: examples/conduit
        env:
          BROWSERS: ${{ matrix.browser }}
          E2E_NAME: node-${{ matrix.browser }}
        run: |
          npm run test:e2e -- --retries=0 || status=$?
          node test/e2e-summary.mjs test-results/e2e-node-${{ matrix.browser }}.json
          exit ${status:-0}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-e2e-node-${{ matrix.browser }}
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  e2e-workers:
    name: E2E on Cloudflare Workers (wrangler dev, local D1), chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci, and the pinned wrangler (with workerd)
        working-directory: examples/conduit
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund wrangler@4.152.0
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: npm run build:workers
        working-directory: examples/conduit
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:workers
      - name: The pinned Playwright's chromium
        run: |
          npm install --prefix .work/pw --no-audit --no-fund playwright-core@1.63.0
          bash scripts/ci/playwright-install.sh chromium
      - name: The official RealWorld end-to-end suite against wrangler dev
        working-directory: examples/conduit
        env:
          BROWSERS: chromium
          E2E_NAME: workers-chromium
          E2E_SERVER: wrangler dev --port 4100 --ip 127.0.0.1
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run test:e2e -- --retries=0 || status=$?
          node test/e2e-summary.mjs test-results/e2e-workers-chromium.json
          exit ${status:-0}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-e2e-workers-chromium
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  e2e-bun:
    name: E2E on Bun (bun:sqlite), chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: npm ci, and the pinned Bun
        working-directory: examples/conduit
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund bun@1.4.4
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: npm run build:bun
        working-directory: examples/conduit
        run: node ../../scripts/full-lean/run-bounded.mjs --memory-mib 8192 -- npm run build:bun
      - name: The pinned Playwright's chromium
        timeout-minutes: 30
        run: |
          npm install --prefix .work/pw --no-audit --no-fund playwright-core@1.63.0
          bash scripts/ci/playwright-install.sh chromium
      - name: The official RealWorld end-to-end suite against Bun
        working-directory: examples/conduit
        env:
          BROWSERS: chromium
          E2E_NAME: bun-chromium
          E2E_SERVER: bun bun/main.mjs
        run: |
          rm -f conduit.db*
          npm run test:e2e -- --retries=0 || status=$?
          node test/e2e-summary.mjs test-results/e2e-bun-chromium.json
          exit ${status:-0}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-e2e-bun-chromium
          path: examples/conduit/test-results/
          retention-days: 14
          if-no-files-found: warn
  # Every other platform, each served by its own local tooling
  # (examples/conduit/test/platforms.mjs): one job per platform builds
  # Conduit as the platform builds it, then runs the official API suite and
  # the official end-to-end suite (Chromium, no retries) against it.
  platform:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: deno
            title: Deno 2.9.6 (node:sqlite)
            build: npm run build:deno
          - platform: docker
            title: Docker (node:24-bookworm-slim, read-only, 512 MB)
            build: npm run build:docker
          - platform: lambda
            title: AWS Lambda .zip (sam local start-api, nodejs24.x)
            build: npm run build:lambda
          - platform: lambda-image
            title: AWS Lambda container image (sam local start-api, AWS base image)
            build: npm run build:lambda-image
          - platform: vercel
            title: Vercel Functions (vercel build offline, Vercel's Node launcher)
            build: vercel build --yes
          - platform: netlify
            title: Netlify Functions (netlify build and netlify dev, offline)
            build: netlify build --offline
          - platform: azure
            title: Azure Functions (func start)
            build: npm run build:azure
          - platform: gcf
            title: Google Cloud Functions (Functions Framework)
            build: npm run build:gcf
          - platform: deno-deploy
            title: Deno Deploy (Deno 2.9.6, Deno KV)
            build: npm run build:deno-deploy
          - platform: vercel-edge
            title: Vercel Edge (vercel build offline, edge-runtime)
            # api/lasm.mjs must exist before vercel build detects functions (it
            # does not detect the one its build command writes; DECISIONS.md).
            build: npm run build:vercel-edge && cp deploy/vercel-edge/vercel.json vercel.json && vercel build --yes
          - platform: netlify-edge
            title: Netlify Edge (netlify build and netlify dev, offline; Netlify Blobs)
            build: cp deploy/netlify-edge/netlify.toml netlify.toml && netlify build --offline
          - platform: fastly
            title: Fastly Compute (Viceroy 0.21.1, Fastly KV)
            build: npm run build:fastly
          - platform: wasi-http
            title: wasi-http (wasmtime 49.0.4 serve; Postgres through PostgREST)
            build: npm run build:wasi-http && node test/postgrest.mjs up
          - platform: spin
            title: Spin 4.2.2 (wasi-http; Postgres through PostgREST)
            build: npm run build:wasi-http && node test/postgrest.mjs up
          - platform: supabase-edge
            title: Supabase Edge Functions (supabase start, supabase functions serve; Postgres)
            build: npm run build:supabase-edge && supabase start
    env:
      # No account or credentials of any platform, and no telemetry.
      SAM_CLI_TELEMETRY: '0'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_TOKEN: ''
      NETLIFY_TELEMETRY_DISABLED: '1'
      NETLIFY_AUTH_TOKEN: ''
      FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      SPIN_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      # The example's directory (the Netlify jobs use a copy, below).
      CONDUIT: examples/conduit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Netlify only, the example outside this repository (Netlify's CLI takes the repository, whose package.json has workspaces, for a monorepo and serves no function)
        if: matrix.platform == 'netlify' || matrix.platform == 'netlify-edge'
        run: |
          cp -a examples/conduit "$RUNNER_TEMP/conduit"
          echo "CONDUIT=$RUNNER_TEMP/conduit" >> "$GITHUB_ENV"
      - name: npm ci
        working-directory: ${{ env.CONDUIT }}
        run: npm ci --no-audit --no-fund
      - name: The platform's pinned tools
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T"
          case "$PLATFORM" in
            deno|deno-deploy) npm install --prefix "$T" --no-audit --no-fund deno@2.9.6 ;;
            lambda|lambda-image)
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/sam.zip" https://github.com/aws/aws-sam-cli/releases/download/v1.170.0/aws-sam-cli-linux-x86_64.zip
              unzip -q "$RUNNER_TEMP/sam.zip" -d "$RUNNER_TEMP/sam-installer"
              "$RUNNER_TEMP/sam-installer/install" --install-dir "$RUNNER_TEMP/sam" --bin-dir "$T/node_modules/.bin" ;;
            vercel|vercel-edge)
              npm install --prefix "$T" --no-audit --no-fund vercel@65.2.0 edge-runtime@4.0.1 esbuild@0.28.2
              echo "VERCEL_NODE_MODULES=$T/node_modules" >> "$GITHUB_ENV"
              echo "VERCEL_EDGE_TOOLS=$T" >> "$GITHUB_ENV"
              # A local project link stands in for `vercel link` (no account).
              mkdir -p "$CONDUIT/.vercel"
              echo '{"projectId":"prj_conduit_ci","orgId":"team_conduit_ci","settings":{}}' > "$CONDUIT/.vercel/project.json"
              # No credentials: a home of its own.
              echo "XDG_DATA_HOME=$RUNNER_TEMP/vercel-home/data" >> "$GITHUB_ENV"
              echo "XDG_CONFIG_HOME=$RUNNER_TEMP/vercel-home/config" >> "$GITHUB_ENV" ;;
            # Deno from npm: Netlify's edge runtime is the Deno CLI on PATH (nothing downloaded).
            supabase-edge) npm install --prefix "$T" --no-audit --no-fund supabase@2.122.0 ;;
            fastly|wasi-http|spin)
              get() { curl -fsSL --retry 3 -o "$RUNNER_TEMP/$2" "$1"; echo "$3  $RUNNER_TEMP/$2" | sha256sum -c; }
              mkdir -p "$T/node_modules/.bin" "$RUNNER_TEMP/wasi-tools"
              case "$PLATFORM" in
                fastly)
                  get https://github.com/fastly/Viceroy/releases/download/v0.21.1/viceroy_v0.21.1_linux-amd64.tar.gz viceroy.tgz 54a5b46ab05ce1492f4df136728b2eb81b350cb42da5d9f2eec66558ddc1e233
                  tar -xzf "$RUNNER_TEMP/viceroy.tgz" -C "$T/node_modules/.bin" viceroy ;;
                wasi-http)
                  get https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz wasmtime.tar.xz 6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9
                  tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasi-tools" --strip-components=1
                  ln -s "$RUNNER_TEMP/wasi-tools/wasmtime" "$T/node_modules/.bin/wasmtime" ;;
                spin)
                  get https://github.com/spinframework/spin/releases/download/v4.2.2/spin-v4.2.2-static-linux-amd64.tar.gz spin.tgz ff870e915b41216318e525198028fc1017e96f599f54bbfd4e983730d0a1fecd
                  tar -xzf "$RUNNER_TEMP/spin.tgz" -C "$RUNNER_TEMP/wasi-tools"
                  ln -s "$RUNNER_TEMP/wasi-tools/spin" "$T/node_modules/.bin/spin" ;;
              esac ;;
            netlify|netlify-edge) npm install --prefix "$T" --no-audit --no-fund netlify-cli@27.14.2 deno@2.9.6 ;;
            azure)
              # Azure Functions Core Tools 4.16.0, the archive its npm package downloads
              # (npm 11 skips that package's install script), checked by SHA-256.
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/func.zip" https://cdn.functions.azure.com/public/4.0.308342/Azure.Functions.Cli.linux-x64.4.16.0.zip
              echo "c68c7780d94c7583157f7a7d1a05e0ec3e34057c3d55e4c7be71fc4aa0c23667  $RUNNER_TEMP/func.zip" | sha256sum -c
              unzip -q "$RUNNER_TEMP/func.zip" -d "$RUNNER_TEMP/func" && rm "$RUNNER_TEMP/func.zip"
              chmod 755 "$RUNNER_TEMP/func/func" "$RUNNER_TEMP/func/in-proc8/func" "$RUNNER_TEMP/func/in-proc6/func"
              mkdir -p "$T/node_modules/.bin" && ln -s "$RUNNER_TEMP/func/func" "$T/node_modules/.bin/func"
              func() { "$RUNNER_TEMP/func/func" "$@"; }; func --version ;;
          esac
          mkdir -p "$T/node_modules/.bin"
          echo "$T/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'lambda' || matrix.platform == 'lambda-image' || matrix.platform == 'vercel'
        id: images-lambda
        with:
          path: ${{ runner.temp }}/image-cache/lambda
          key: ci-images-lambda-${{ hashFiles('scripts/ci/images.lock.json') }}
      - name: The pinned Lambda images (cache, else registry by digest)
        if: matrix.platform == 'lambda' || matrix.platform == 'lambda-image' || matrix.platform == 'vercel'
        run: node scripts/ci/image-cache.mjs ensure "$RUNNER_TEMP/image-cache/lambda" lambda
      - name: Build (${{ matrix.build }})
        working-directory: ${{ env.CONDUIT }}
        run: node "$GITHUB_WORKSPACE/scripts/full-lean/run-bounded.mjs" --memory-mib 8192 -- bash -c "${{ matrix.build }}"
      - name: The official RealWorld API suite
        working-directory: ${{ env.CONDUIT }}
        run: node test/api.mjs --platform ${{ matrix.platform }}
      - name: The pinned Playwright's chromium
        timeout-minutes: 30
        run: |
          npm install --prefix .work/pw --no-audit --no-fund playwright-core@1.63.0
          bash scripts/ci/playwright-install.sh chromium
      - name: The official RealWorld end-to-end suite
        working-directory: ${{ env.CONDUIT }}
        env:
          BROWSERS: chromium
          E2E_NAME: ${{ matrix.platform }}-chromium
          E2E_PLATFORM: ${{ matrix.platform }}
        run: |
          npm run test:e2e -- --retries=0 || status=$?
          node test/e2e-summary.mjs test-results/e2e-${{ matrix.platform }}-chromium.json
          exit ${status:-0}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conduit-${{ matrix.platform }}
          path: ${{ env.CONDUIT }}/test-results/
          retention-days: 14
          if-no-files-found: warn
