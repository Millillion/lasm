name: Differential testing
# Black-box differential testing of the compiler (docs/TESTING.md#differential-testing):
# random well-typed Lean programs (scripts/differential/generate.mjs) built with
# upstream Lean 4.35.0 natively (the oracle) and with a candidate packed from
# this commit and installed with npm, as a user installs @lasm/cli, for node,
# wasi (wasmtime and node:wasi) and the edge runtime (--target deno, run by
# Deno). Any difference in stdout, stderr or exit status fails the job; the
# divergence is shrunk and its reproducer (a regression case for
# test/differential/regressions/) is in the `differential-<run>` artifact.
# Three more comparisons (docs/TESTING.md#more-oracles): Lean's interpreter as a
# second oracle (its disagreements with native Lean are upstream suspects,
# reported, never failures), the same program built unoptimized
# (LASM_TEST_UNOPTIMIZED: node-O0 on PRs; wasi-O0 and deno-O0 too in campaigns)
# and the same edge .wasm on Node (V8), Bun (JavaScriptCore) and SpiderMonkey.
# Two more targets: --target bun run by Bun, and --target browser mounted in
# headless Playwright browsers (Chromium on PRs; Firefox and WebKit too in
# campaigns, on the program without IO.sleep, since they run without JSPI).
#   - pull requests and pushes to main: the regression corpus plus one seeded
#     three program pairs (3 × (150 + 25) cases) from a seed derived from the commit (reproducible: the
#     seed is in the log and the summary);
#   - nightly (and by hand): a campaign of `budget-min` minutes from a fresh seed.
on:
  pull_request:
    branches: [main]
    # Not on a change to docs, Markdown, content/ or the five flagship apps only
    # (they have their own workflows); the push to main always runs (docs/CI.md).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'content/**'
      - 'examples/conduit/**'
      - 'examples/folio/**'
      - 'examples/ledger/**'
      - 'examples/porter/**'
      - 'examples/tandem/**'
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_call:
    inputs:
      budget-min: { type: string, default: '0' }
  workflow_dispatch:
    inputs:
      budget-min:
        description: Campaign length in minutes (0 = one program pair)
        default: '60'
        type: string
      seed:
        description: First seed (empty = derived from the run)
        default: ''
        type: string
      profile:
        description: release or dev
        default: release
        type: string
permissions:
  contents: read
concurrency:
  # github.workflow: ci-weekly.yml's call never queues behind this workflow's own nightly run.
  group: differential-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  WASMTIME_VERSION: v49.0.4
  WASMTIME_SHA256: 6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9
  # The engine differential's engines, official release binaries pinned by SHA-256:
  # Bun (JavaScriptCore) from oven-sh/bun's release, SpiderMonkey's js shell from
  # Mozilla's release archive (SHA256SUMS of the release).
  BUN_VERSION: 1.4.4
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
  JSSHELL_VERSION: 158.0.1
  JSSHELL_SHA256: 6b9158af52a3e687eec10ccd600356a1cab7d6e45f91f3fec9efbbf0bd2c7494
  PLAYWRIGHT: 1.63.0
  DIFF_TARGETS_PR: node,wasi,wasi-node,deno,interp,node-O0,edge-node,edge-bun,edge-sm,bun,browser-chromium
  DIFF_TARGETS_FULL: node,wasi,wasi-node,deno,interp,node-O0,wasi-O0,deno-O0,edge-node,edge-bun,edge-sm,bun,bun-O0,browser-chromium,browser-firefox,browser-webkit
jobs:
  # The macOS jobs (stack-depth on macOS, macos-c-tier) run nightly, weekly and by
  # hand; on a pull request or a push to main only when macOS-specific code
  # changes (docs/CI.md#what-moved-out-of-the-pr-tier-and-why-that-is-safe).
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          MACOS_PATHS: '^(src/macos-tbd\.mjs|src/managed-lean\.mjs|src/managed-artifacts\.mjs|scripts/lean-dist/|scripts/ci/macos-c-tier\.mjs|scripts/ci/stack-depth\.mjs|scripts/ecosystem/projects/native-tactic/|test/macos-tbd\.test\.mjs|test/managed-lean-tiers\.test\.mjs|test/fixtures/macos-tbd/|\.github/workflows/differential\.yml$|\.github/actions/install-candidate/)'
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            # An unknown range (a new branch, a failed comparison) counts as a macOS change.
            push) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' || echo .github/workflows/differential.yml) ;;
            *) echo macos=true >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if printf '%s\n' "$files" | grep -qE "$MACOS_PATHS"; then echo macos=true; else echo macos=false; fi | tee -a "$GITHUB_OUTPUT"
  pack:
    if: github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The retained runtime input is a draft release asset (needs contents: write to read).
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/process-guard
      - name: Download the pinned retained runtime input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/fetch-node-runtime.mjs
      - name: Verify and extract the runtime
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 -- node scripts/ci/restore-node-runtime.mjs
      - name: Pack
        run: node scripts/full-lean/run-bounded.mjs --memory-mib 2048 -- /usr/bin/env GITHUB_RUN_ID="$GITHUB_RUN_ID" node scripts/package-node-release.mjs .work/node-candidate .work/node-runtime-restored/runtime .work/node-runtime-restored/native "$(node -p "require('./.work/node-runtime-restored/provenance.json').runtimeManifestSha256")" "$LASM_CANDIDATE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-packed-candidate
          path: .work/node-candidate/lasm-compiler-${{ env.LASM_CANDIDATE_VERSION }}.tgz
          retention-days: 3
          if-no-files-found: error
  differential:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # Nightly: the release and the dev profile (different Binaryen passes), 60 minutes each.
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'schedule' && '["release","dev"]' || format('["{0}"]', inputs.profile || 'release')) }}
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Native Lean (the oracle)
        id: lean
        uses: ./.github/actions/upstream-lean
      - name: wasmtime, Deno, Bun and SpiderMonkey
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T/wasmtime"
          curl -fsSL --retry 3 -o "$T/wasmtime.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          echo "$WASMTIME_SHA256  $T/wasmtime.tar.xz" | sha256sum -c
          tar -xJf "$T/wasmtime.tar.xz" -C "$T/wasmtime" --strip-components=1
          npm install --prefix "$T" --no-audit --no-fund deno@2.9.6
          curl -fsSL --retry 3 -o "$T/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $T/bun.zip" | sha256sum -c
          unzip -q "$T/bun.zip" -d "$T"
          mkdir -p "$T/jsshell"
          curl -fsSL --retry 3 -o "$T/jsshell.zip" "https://archive.mozilla.org/pub/firefox/releases/$JSSHELL_VERSION/jsshell/jsshell-linux-x86_64.zip"
          echo "$JSSHELL_SHA256  $T/jsshell.zip" | sha256sum -c
          unzip -q "$T/jsshell.zip" -d "$T/jsshell"
          "$T/wasmtime/wasmtime" --version; "$T/node_modules/.bin/deno" --version; "$T/bun-linux-x64/bun" --version; "$T/jsshell/js" --version
      # One program pair (pull requests, pushes): Chromium only; a campaign: all three browsers.
      - name: Plan
        id: plan
        run: |
          BUDGET="${{ inputs.budget-min || '' }}"
          if [ -z "$BUDGET" ]; then if [ "${{ github.event_name }}" = schedule ]; then BUDGET=60; else BUDGET=0; fi; fi
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
          if [ "$BUDGET" = 0 ]; then B="chromium"; else B="chromium firefox webkit"; fi
          echo "browsers=$B" >> "$GITHUB_OUTPUT"; echo "browsers-key=${B// /-}" >> "$GITHUB_OUTPUT"
      - name: Pinned Playwright and its browsers, cached per version
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          version: ${{ env.PLAYWRIGHT }}
          browsers: ${{ steps.plan.outputs.browsers }}
          cache-key: playwright-${{ env.PLAYWRIGHT }}-differential-${{ steps.plan.outputs.browsers-key }}-ubuntu-24.04
      - name: Differential run
        id: run
        run: |
          set -o pipefail
          BUDGET="${{ steps.plan.outputs.budget }}"
          SEED="${{ inputs.seed || '' }}"
          if [ -z "$SEED" ]; then
            if [ "$BUDGET" = 0 ]; then SEED=$(( 16#$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7) )); else SEED=$(( (${{ github.run_id }} + ${{ matrix.profile == 'dev' && '500000000' || '0' }}) % 1000000000 )); fi
          fi
          echo "seed $SEED, budget $BUDGET min"
          # Pull requests: the cheap subset of the extra oracles; campaigns: all of them.
          if [ "$BUDGET" = 0 ]; then AMOUNT="--programs 3"; TARGETS="$DIFF_TARGETS_PR"; else AMOUNT="--budget-min $BUDGET"; TARGETS="$DIFF_TARGETS_FULL"; fi
          T="$RUNNER_TEMP/tools"
          node scripts/differential/run.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --lean-bin "${{ steps.lean.outputs.bin }}" --work "$RUNNER_TEMP/difftest" \
            --seed "$SEED" $AMOUNT --cases 150 --fs-cases 25 --targets "$TARGETS" \
            --profile "${{ matrix.profile }}" --regressions test/differential/regressions \
            --wasmtime "$T/wasmtime/wasmtime" --deno "$T/node_modules/.bin/deno" --bun "$T/bun-linux-x64/bun" --sm "$T/jsshell/js" --playwright "$GITHUB_WORKSPACE/.work/pw" 2>&1 | tee "$RUNNER_TEMP/difftest.log"
      # The regression corpus in the dev profile too (node, then the other targets,
      # in one project: how a Node dev build followed by a WASI dev build failed).
      - name: Regressions in the dev profile
        if: matrix.profile == 'release'
        run: |
          T="$RUNNER_TEMP/tools"
          node scripts/differential/run.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --lean-bin "${{ steps.lean.outputs.bin }}" --work "$RUNNER_TEMP/difftest-dev" \
            --programs 0 --targets "$DIFF_TARGETS_PR" --profile dev --regressions test/differential/regressions \
            --wasmtime "$T/wasmtime/wasmtime" --deno "$T/node_modules/.bin/deno" --bun "$T/bun-linux-x64/bun" --sm "$T/jsshell/js" --playwright "$GITHUB_WORKSPACE/.work/pw"
      # Recursion depth (issue #66): Node's default stack against native Lean's
      # depth, the overflow diagnostic, and the limit of every other target.
      - name: Recursion depth
        if: matrix.profile == 'release'
        run: |
          T="$RUNNER_TEMP/tools"
          node scripts/ci/stack-depth.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --work "$RUNNER_TEMP/stack-depth" --out "$RUNNER_TEMP/stack-depth.json" --targets node,wasi,wasi-node,deno,edge-node,edge-bun,edge-sm,edge-O0,edge-O0-node,edge-O0-bun \
            --wasmtime "$T/wasmtime/wasmtime" --deno "$T/node_modules/.bin/deno" --bun "$T/bun-linux-x64/bun" --sm "$T/jsshell/js"
      - name: Summary
        if: always()
        run: |
          node -e "
          const s = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/difftest/summary.json', 'utf8'));
          const cases = s.programs.reduce((n, p) => n + p.cases, 0);
          let md = '### Differential testing\n\nSeed ' + s.seed0 + ', ' + s.programs.length + ' programs, ' + cases + ' cases, targets ' + s.targets.join(', ') + ' (' + s.profile + '): **' + s.divergences.length + ' divergences**, ' + s.harnessErrors.length + ' harness errors.\n';
          for (const d of s.divergences) md += '\n- ' + (d.target ?? '') + ' seed ' + (d.seed ?? 'regressions') + ' case ' + (d.case ?? d.cases ?? '') + ': ' + (d.what ?? 'output differs') + (d.regression ? ' (reproducer ' + d.regression + ')' : '');
          const up = s.upstreamSuspects ?? [];
          md += '\n\n**' + up.length + ' upstream suspects** (native Lean and its interpreter disagree: an upstream Lean question, not a Lasm failure).\n';
          for (const d of up) md += '\n- seed ' + (d.seed ?? 'regressions') + ' case ' + (d.case ?? d.cases ?? '') + ': ' + (d.what ?? 'output differs') + (d.regression ? ' (reproducer ' + d.regression + ')' : '');
          for (const k of s.knownDivergences ?? []) if (k.applied) md += '\n- known: ' + k.what + ' (' + k.issue + '), applied ' + k.applied + ' times';
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          " || true
      - name: Preserve reproducers and the summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/difftest.log
            ${{ runner.temp }}/difftest/summary.json
            ${{ runner.temp }}/difftest/repros
            ${{ runner.temp }}/stack-depth.json
          retention-days: 30
          if-no-files-found: ignore
  # Host behaviour of ordinary Lean programs (integration/host-fixtures.mjs): the
  # fixtures of the unit files that built with the retired Lean 4.32 pipeline
  # (cwd, permissions, processes, environment and path bytes, temporary files,
  # finalizers, TCP, clocks), built with the installed candidate for Node and
  # compared with upstream Lean 4.35.0's `lean --run`. Pull requests and main.
  host-fixtures:
    needs: pack
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Native Lean (the oracle)
        id: lean
        uses: ./.github/actions/upstream-lean
      - name: Host fixtures
        run: |
          node integration/host-fixtures.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --lean-bin "${{ steps.lean.outputs.bin }}" --work "$RUNNER_TEMP/host-fixtures" \
            --out "$RUNNER_TEMP/host-fixtures.json"
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/host-fixtures.json
          retention-days: 30
          if-no-files-found: ignore
  # Recursion depth under Node on macOS and Windows (issue #66,
  # scripts/ci/stack-depth.mjs): the default stack differs there (Windows
  # commits thread stacks), so it is checked on each.
  stack-depth:
    needs: [scope, pack]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.scope.outputs.macos == 'true' && '["macos-15","windows-2025"]' || '["windows-2025"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Recursion depth
        run: |
          node scripts/ci/stack-depth.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --work "$RUNNER_TEMP/stack-depth" --out "$RUNNER_TEMP/stack-depth.json" --targets node
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-depth-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stack-depth.json
          retention-days: 30
          if-no-files-found: ignore
  # The macOS C tier against each runner's own SDK (issue #73,
  # scripts/ci/macos-c-tier.mjs): a Lake project with a precompiled module, which
  # Lake links with Lean's ld64.lld against the SDK's libSystem.tbd, built once
  # with the SDK as it is and once with an SDK whose stub lists the arm64e.x1
  # targets of newer SDKs (rejected by that linker unless Lasm filters them).
  macos-c-tier:
    needs: [scope, pack]
    if: needs.scope.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Native Lake build linking against the SDK's libSystem.tbd
        # Two native C-tier Lake builds peak near half of a 7 GB runner's RAM;
        # --host-fraction 0.7 (CI runners only) keeps them clear of the stop.
        run: |
          node scripts/full-lean/run-bounded.mjs --memory-mib 5120 --host-fraction 0.7 -- \
            node scripts/ci/macos-c-tier.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
              --work "$RUNNER_TEMP/macos-c-tier" --out "$RUNNER_TEMP/macos-c-tier.json"
      - name: The stub filter's unit tests, with this C tier's ld64.lld
        run: |
          LASM_TEST_LD64="$(ls "$HOME"/Library/Caches/lasm/derived/*/bin/ld64.lld | head -1)" \
            node scripts/full-lean/run-bounded.mjs --memory-mib 1024 -- node --test test/macos-tbd.test.mjs test/managed-lean-tiers.test.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-c-tier-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/macos-c-tier.json
            .work/resource-runs
          retention-days: 30
          if-no-files-found: ignore
  # Target equivalence (docs/TESTING.md#target-equivalence): the fetch template
  # (from `lasm init`) and examples/fetch built for every server target this
  # runner can serve locally, the recorded corpus replayed on each.
  equivalence:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [fetch-template, fetch-example]
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Wasmtime, Deno, Bun and wrangler (local workerd only)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T/wasmtime"
          curl -fsSL --retry 3 -o "$T/wasmtime.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          echo "$WASMTIME_SHA256  $T/wasmtime.tar.xz" | sha256sum -c
          tar -xJf "$T/wasmtime.tar.xz" -C "$T/wasmtime" --strip-components=1
          npm install --prefix "$T" --no-audit --no-fund deno@2.9.6 bun@1.4.4 wrangler@4.152.0
      - name: Replay the corpus on every target
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          T="$RUNNER_TEMP/tools"
          node scripts/equivalence/run.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --work "$RUNNER_TEMP/equivalence" --app ${{ matrix.app }} --targets node,deno,bun,wasi-http,workers \
            --deno "$T/node_modules/.bin/deno" --bun "$T/node_modules/.bin/bun" --wasmtime "$T/wasmtime/wasmtime" --wrangler "$T/node_modules/.bin/wrangler"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: equivalence-${{ matrix.app }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/equivalence/*-results.json
            ${{ runner.temp }}/equivalence/*.json
          retention-days: 30
          if-no-files-found: ignore
  # Async loop depth (issue #90, scripts/ci/async-depth.mjs): the deepest Async
  # loop of awaited (and synchronous) Lasm.JS host calls on Node, Deno, Bun and
  # workerd (wrangler dev, offline), held above a floor, and the documented
  # workaround (Std.Async.sleep 0 every 100 calls) completing 100,000 calls.
  async-depth:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      BROWSER: 'none'
      LASM_CANDIDATE_VERSION: 0.1.0-experimental.${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install the candidate as a user would
        uses: ./.github/actions/install-candidate
        with:
          artifact: differential-packed-candidate
          version: ${{ env.LASM_CANDIDATE_VERSION }}
      - name: Deno, Bun and wrangler (local workerd only)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund deno@2.9.6 bun@1.4.4 wrangler@4.152.0
      - name: Async loop depth
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          T="$RUNNER_TEMP/tools/node_modules/.bin"
          node scripts/ci/async-depth.mjs --lasm "$RUNNER_TEMP/lasm/node_modules/@lasm/compiler/bin/lasm.mjs" \
            --work "$RUNNER_TEMP/async-depth" --out "$RUNNER_TEMP/async-depth.json" --targets node,deno,bun,workers \
            --deno "$T/deno" --bun "$T/bun" --wrangler "$T/wrangler"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: async-depth-${{ github.run_id }}
          path: ${{ runner.temp }}/async-depth.json
          retention-days: 30
          if-no-files-found: ignore
