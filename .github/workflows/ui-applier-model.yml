name: UI applier model
# The model differential of the Lasm.UI applier (docs/TESTING.md#model-differentials):
# test/models/ui-applier-differential.mjs applies patch frames with the
# shipped applier (src/lasm-modules/ui-dom.mjs) on happy-dom, its insertion
# checks made the DOM standard's, and with its Lean model
# (library/Lasm/UI/Proofs/Applier.lean, test/models/UiApplierModel.lean),
# and fails when the DOMs differ after any frame or one side refuses a frame
# the other applies: Lean's diff of random views (whose patches must conform,
# Lasm.UI.Candidates.diff_conforms), random operations, hydration of random
# server DOMs, and the 120 sessions of test/fixtures/ui/patches.json, plain
# and hydrating their server-rendered HTML. The proofs about the model
# (Lasm.UI.Spec.applier_correct, applier_session, hydrate_correct) are
# checked by library-proofs.yml. Free runner only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ui-applier-model.yml'
      - 'src/lasm-modules/ui-dom.mjs'
      - 'library/Lasm/UI/**'
      - 'test/models/ui-applier-differential.mjs'
      - 'test/models/UiApplierModel.lean'
      - 'test/fixtures/ui/**'
      - 'test/helpers/property.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-applier-model.yml'
      - 'src/lasm-modules/ui-dom.mjs'
      - 'library/Lasm/UI/**'
      - 'test/models/ui-applier-differential.mjs'
      - 'test/models/UiApplierModel.lean'
      - 'test/fixtures/ui/**'
      - 'test/helpers/property.mjs'
permissions:
  contents: read
concurrency:
  group: ui-applier-model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      BROWSER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The applier agrees with its Lean model
        run: node test/models/ui-applier-differential.mjs --runs 1000
