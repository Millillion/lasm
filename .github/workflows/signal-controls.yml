name: Native application signal controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-controls-${{ github.ref }}
  cancel-in-progress: false

# Source controls on free standard public runners, with no Actions caches or
# uploaded artifacts. Native compilation here is not shipped-binary acceptance.
jobs:
  signals:
    if: github.event.repository.visibility == 'public'
    name: Signal routing ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      LASM_EXPECT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.12.1
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify native host
        run: node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,process.env.LASM_EXPECT_PLATFORM)"
      - name: Enable process-tree guard
        run: |
          sudo loginctl enable-linger "$(id -un)"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" >> "$GITHUB_ENV"
      - name: Disable core collection on this disposable CI runner
        run: |
          mkdir -p .work
          cat /proc/sys/kernel/core_pattern > .work/original-core-pattern
          # A piped systemd collector ignores RLIMIT_CORE and can delay
          # deliberate SIGABRT cases beyond their existing ten-second deadline.
          # A plain pattern respects the service's zero limit; no dump is made.
          sudo sysctl --write kernel.core_pattern=core
      - name: Build native control helper
        run: |
          ulimit -c 0
          node scripts/full-lean/run-bounded.mjs --memory-mib 1024 --report .work/signal-helper-build-resources.json -- node scripts/build-signal-helper.mjs --native
      - name: Guarded signal controls
        run: |
          ulimit -c 0
          node scripts/full-lean/run-bounded.mjs --memory-mib 1024 --report .work/signal-controls-resources.json -- node --max-old-space-size=128 --test --test-concurrency=1 test/node-signal.test.mjs test/application-signals.test.mjs test/application-output.test.mjs
      - name: Preserve guard and helper receipts in logs
        if: always()
        run: |
          node -e "const f=require('node:fs');for(const p of ['.work/signal-helper-build-resources.json','.work/signal-controls-resources.json','.cache/native-host/signals/manifest.json'])if(f.existsSync(p))console.log(p+'\n'+f.readFileSync(p,'utf8'))"
      - name: Restore this runner's core collection policy
        if: always()
        run: |
          if test -f .work/original-core-pattern; then
            sudo tee /proc/sys/kernel/core_pattern < .work/original-core-pattern
          fi
