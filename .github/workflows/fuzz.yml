name: Fuzz
# Coverage-guided fuzzing at Lasm's input boundaries (docs/TESTING.md#fuzzing-at-the-boundaries,
# test/fuzz/): the CLI's argument parser, the Lasm.UI patch decoder, the
# function platforms' HTTP mapping and the Lasm.JS value codec (JavaScript,
# under V8 block coverage; the last two checked against Lean: the model
# library/Lasm/Serverless/Proofs/Model.lean, and Lean's own codec), the
# Lasm.UI applier's reading against Lean's reference decoder (ui-decode), Lasm's
# tar reader against Python's tarfile (tar), and
# Lasm.Fetch's request parsing, Lasm.RPC's decoding and the WASI C host's CGI
# request (libFuzzer, ASan; UBSan for the C host).
#   - pull requests and pushes to main: the committed corpus and regressions,
#     once each (seconds); the native targets when their sources change;
#   - nightly: 10 minutes per target; weekly (Saturday): 60 minutes per target.
# A campaign fails on any failing input (a crash, a hang, a broken property)
# and uploads its new corpus entries and failing inputs as an artifact.
on:
  pull_request:
    branches: [main]
    # Not on a change to docs, Markdown, content/ or the five flagship apps only
    # (they have their own workflows); the push to main always runs (docs/CI.md).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'content/**'
      - 'examples/conduit/**'
      - 'examples/folio/**'
      - 'examples/ledger/**'
      - 'examples/porter/**'
      - 'examples/tandem/**'
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 2-6'
    - cron: '41 6 * * 6'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: '1'
  BROWSER: 'none'
jobs:
  sunday:
    # Nothing runs on a scheduled Sunday in New York (sunday-guard.yml).
    uses: ./.github/workflows/sunday-guard.yml

  replay:
    needs: sunday
    name: Replay the corpus
    if: needs.sunday.outputs.skip != 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The Lean model of src/serverless/ (serverless-http's oracle)
        run: node test/fuzz/support/serverless-model.mjs
      - name: Lean's half of the Lasm.JS value codec (lasm-js-wire's oracle)
        run: node test/fuzz/support/js-wire-model.mjs
      - name: Lean's reference decoder of Lasm.UI patches (ui-decode's oracle)
        run: node test/fuzz/support/ui-decode-model.mjs
      - name: JavaScript targets
        env:
          LASM_SERVERLESS_MODEL: required
          LASM_JS_WIRE_MODEL: required
          LASM_UI_DECODE_MODEL: required
        run: node test/fuzz/run.mjs replay cli-arguments serverless-http ui-patch ui-decode lasm-js-wire tar
      - name: Do the native targets' sources change?
        id: native
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] || git diff --name-only "$BASE" HEAD | grep -qE '^(library/|src/wasi/|src/managed-lean\.mjs|src/lasm-library\.mjs|src/toolchains\.json|test/fuzz/|\.github/workflows/fuzz\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: libFuzzer runtime
        if: steps.native.outputs.changed == 'true'
        run: scripts/fuzz/ensure-libfuzzer.sh
      - name: Build the native targets
        if: steps.native.outputs.changed == 'true'
        run: node test/fuzz/native/build.mjs
      - name: Native targets
        if: steps.native.outputs.changed == 'true'
        run: node test/fuzz/run.mjs replay lean-fetch-request lean-rpc wasi-cgi

  campaign:
    needs: sunday
    name: Fuzz ${{ matrix.target }}
    if: needs.sunday.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [cli-arguments, serverless-http, ui-patch, ui-decode, lasm-js-wire, tar, lean-fetch-request, lean-rpc, wasi-cgi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The Lean model of src/serverless/ (the oracle)
        if: matrix.target == 'serverless-http'
        run: |
          node test/fuzz/support/serverless-model.mjs
          echo "LASM_SERVERLESS_MODEL=required" >> "$GITHUB_ENV"
      - name: Lean's half of the Lasm.JS value codec (the oracle)
        if: matrix.target == 'lasm-js-wire'
        run: |
          node test/fuzz/support/js-wire-model.mjs
          echo "LASM_JS_WIRE_MODEL=required" >> "$GITHUB_ENV"
      - name: Lean's reference decoder of Lasm.UI patches (the oracle)
        if: matrix.target == 'ui-decode'
        run: |
          node test/fuzz/support/ui-decode-model.mjs
          echo "LASM_UI_DECODE_MODEL=required" >> "$GITHUB_ENV"
      - name: Native target
        if: startsWith(matrix.target, 'lean-') || matrix.target == 'wasi-cgi'
        run: |
          scripts/fuzz/ensure-libfuzzer.sh
          node test/fuzz/native/build.mjs ${{ matrix.target }}
      - name: Campaign (the seed is printed first)
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event.schedule == '41 6 * * 6' && '3600') || '600' }}
        run: node test/fuzz/run.mjs fuzz --seconds "$SECONDS_PER_TARGET" --seed "$((GITHUB_RUN_ID % 2147483647))" ${{ matrix.target }}
      - name: New corpus entries and failing inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            .work/fuzz/${{ matrix.target }}
            .work/fuzz/summary.json
          retention-days: 30
          if-no-files-found: ignore
