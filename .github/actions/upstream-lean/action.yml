name: Upstream Lean (the oracle)
description: >-
  Installs the pinned upstream Lean 4.36.0-rc2 release archive for linux-x64
  (scripts/lean-dist/lean-4.36.0-rc2-upstream.json), verified by SHA-256 and
  cached per digest, into $RUNNER_TEMP/lean. The differential tests use it as
  the oracle and the host-bridge model checker builds with it.
  docs/CI.md#shared-setup.
inputs:
  add-to-path:
    description: "'true' adds Lean's bin directory to PATH"
    default: 'false'
outputs:
  bin:
    description: Lean's bin directory
    value: ${{ steps.install.outputs.bin }}
  root:
    description: The archive's top-level directory under $RUNNER_TEMP/lean
    value: ${{ steps.pin.outputs.root }}
runs:
  using: composite
  steps:
    - name: The pin
      id: pin
      shell: bash
      run: |
        node -e "const a=require('./scripts/lean-dist/lean-4.36.0-rc2-upstream.json').lean['4.36.0-rc2'].artifacts['linux-x64']; console.log('url='+a.url); console.log('sha256='+a.sha256); console.log('root='+a.root)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ runner.temp }}/lean-archive
        key: upstream-lean-${{ steps.pin.outputs.sha256 }}
    - name: Download, verify and extract
      id: install
      shell: bash
      env:
        LEAN_URL: ${{ steps.pin.outputs.url }}
        LEAN_SHA256: ${{ steps.pin.outputs.sha256 }}
        LEAN_ROOT: ${{ steps.pin.outputs.root }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
      run: |
        set -euo pipefail
        A="$RUNNER_TEMP/lean-archive"; mkdir -p "$A"
        [ -f "$A/lean.tar.zst" ] || curl -fsSL --retry 3 -o "$A/lean.tar.zst" "$LEAN_URL"
        echo "$LEAN_SHA256  $A/lean.tar.zst" | sha256sum -c
        mkdir -p "$RUNNER_TEMP/lean" && tar --zstd -xf "$A/lean.tar.zst" -C "$RUNNER_TEMP/lean"
        BIN="$RUNNER_TEMP/lean/$LEAN_ROOT/bin"
        "$BIN/lean" --version
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"
        if [ "$ADD_TO_PATH" = true ]; then echo "$BIN" >> "$GITHUB_PATH"; fi
    - if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/lean-archive
        key: upstream-lean-${{ steps.pin.outputs.sha256 }}
