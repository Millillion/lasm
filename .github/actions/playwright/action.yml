name: Pinned Playwright browsers
description: >-
  Installs playwright-core at a pinned version into .work/pw and the named
  browsers with their system packages (scripts/ci/playwright-install.sh, which
  retries a stalled apt mirror and download within one budget). With
  cache-key, the browser builds are restored from and saved to the Actions
  cache under that key. The calling step sets timeout-minutes (composite steps
  cannot). docs/CI.md#shared-setup.
inputs:
  browsers:
    description: Space-separated Playwright browsers (chromium firefox webkit)
    required: true
  version:
    description: playwright-core version
    default: 1.63.0
  cache-key:
    description: Actions cache key for the browser builds (empty = no cache)
    default: ''
runs:
  using: composite
  steps:
    - name: Restore the browser builds
      if: inputs.cache-key != ''
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: ${{ inputs.cache-key }}
    - name: playwright-core and the browsers
      shell: bash
      env:
        PW_VERSION: ${{ inputs.version }}
        PW_BROWSERS: ${{ inputs.browsers }}
      run: |
        npm install --prefix .work/pw --no-audit --no-fund "playwright-core@$PW_VERSION"
        for b in $PW_BROWSERS; do bash scripts/ci/playwright-install.sh "$b"; done
    - name: Save the browser builds
      if: inputs.cache-key != '' && steps.restore.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: ${{ inputs.cache-key }}
