name = "stack_app_ssssssssssssssssssssssssssssssssssssssssssssssssssssssssssss"
version = "0.1.0"
defaultTargets = ["Shared", "View"]

# Shared by the server and the browser app: data, API, validation (Shared)
# and the page (View). `lake build` checks them, proofs included.
[[lean_lib]]
name = "Shared"

[[lean_lib]]
name = "View"

# The server's site (routes, first page, embedded files) and HTTP as plain data,
# shared by the server programs.
[[lean_lib]]
name = "Http"

[[lean_lib]]
name = "Embed"

[[lean_lib]]
name = "Site"

[[lean_lib]]
name = "JsSite"

# Server.lean (Node), Workers.lean, Deno.lean, Export.lean (Bun, the other edge targets), Fastly.lean,
# WasiHttp.lean and Client.lean (the browser) are the programs: lasm builds them
# (npm run build). They are not Lake targets.

# Lasm's library (Lasm.JS, Lasm.UI, …) as a Lake package. Every lasm command
# links .lake/lasm-library to it, so Lake and the Lean editor build its
# modules on first import. On a fresh clone, run any lasm command once
# (npm run dev, npx lasm editor) before a plain `lake build`.
[[require]]
name = "lasm"
path = ".lake/lasm-library"
