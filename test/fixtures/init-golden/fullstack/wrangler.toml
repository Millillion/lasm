# Cloudflare Workers: npm run build:workers writes workers/ (the server) and
# dist/public (the browser app); test with npx wrangler dev, deploy with npx wrangler deploy.
name = "fullstack-app"
main = "workers/worker.mjs"
compatibility_date = "2026-10-01"

# The browser app and its files, served by Workers before the Worker runs.
[assets]
directory = "./dist/public"

# The todos live in this KV namespace (Workers.lean's Env.TODOS). wrangler dev
# keeps a local copy under this id; to deploy, create one with
# npx wrangler kv namespace create TODOS and put its id here.
[[kv_namespaces]]
binding = "TODOS"
id = "TODOS"

# Lasm's program.wasm is imported as a precompiled module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false
